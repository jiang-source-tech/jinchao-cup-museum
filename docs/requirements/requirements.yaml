      title: 主体、年龄与关系事实源
      priority: P0
      status: partial
      focus: 固定微信主体、personal pet、memory subject、学生年级、小芯年龄、相处时长和关系时期的事实源与隔离规则。
      implemented:
        - 领域词汇已定义个人宠物、养成、轻量宠物状态和主动关心。
        - 微信主体与设备绑定已存在，记忆通过稳定主体隔离，解绑不会自动删除记忆。
        - 2026-07-18 已确认学生年级、小芯年龄、相处时长和关系阶段的 V2 独立定义。
        - 已确定在现有 `xiaoxin_control.db` 中新增微信主体拥有的独立个人宠物记录，设备和 memory subject 都不作为生命周期事实源。
        - 已新增 `personal_pets` 表、稳定 pet_id、pending/active 状态、companion_started_at 和 started_at_source。
        - openid 建立微信主体时幂等创建 pending 宠物；首次设备绑定在同一 SQLite 事务内激活，重复绑定与换设备不覆盖陪伴起点。
        - Overview 已返回 personal pet 生命周期和真实相处时间投影；旧 companionYear 不是 V2 小芯年龄事实源。
        - 现有已绑定微信主体缺少宠物记录时，可从最早可信设备 bound_at 懒回填并标记 legacy_bound_at。
      requirements:
        - 个人小芯必须拥有稳定 `pet_id`，归微信主体所有；设备和声纹只负责访问与身份确认。
        - "`memory_subject_id` 继续负责说话人隔离，但不承担个人小芯生命周期、年龄或关系阶段的事实源职责。"
