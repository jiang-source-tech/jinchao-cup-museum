  - id: XIAOXIN-003
    title: Xiaoxin CompanionMind V2 runtime
    area: server
    module: xiaoxin-runtime-memory
    milestone: M5
    status: done
    priority: P0
    kind: architecture
    summary: 服务端已完成 CompanionMind V2 干净切换，以统一 Evidence、relationship epoch、确定性策略和 SQLite 事实源取代旧分层记忆。
    implemented:
      - "`XiaoxinRuntime` 只持有一个 `CompanionMind`；身份解析继续提供稳定 `memory_subject_id`，unknown speaker 零私人读写。"
      - 唯一默认事务事实源为 `data/xiaoxin_companion.db`，使用 WAL、外键、busy timeout、幂等和并发事务约束。
      - user Evidence、relationship Evidence、epoch、SessionCapsule、Adjustment、Chapter、initiative 和控制审计使用统一合同。
      - operator 安全投影与开发者记忆工作台支持全状态 Evidence 时间线、归属链、派生血缘、job 健康定位和七类确定性控制，不直接操作文件；miniprogram 权限保持不变。
      - 旧 `core.xiaoxin.memory`、旧 `data/xiaoxin_memory` 运行路径、旧结构性测试和新旧双写已删除；旧数据仅可只读归档。
      - 最终黄金故事和全量测试覆盖重启、reset、模型离线、删除依据、主动陪伴与跨主体隔离。
    remaining: []
    optimizations:
      - 使用生产数据校准关系阈值、Evidence 保留期、主动频率和硬件表达强度。
      - 继续补充开发者记忆工作台的端到端浏览器自动化和大数据量分页验收，但不得暴露完整用户原文或模型推理。
    acceptance:
      - 不同账号、设备、speaker 的记忆不会互相污染。
      - 未知说话人不会落入全局记忆桶。
      - 用户明确称呼和用户成长事实重启后可召回，关系重置后保留；聊天文本不能成为年级事实源。
      - forgotten、superseded、expired 和旧 epoch Evidence 不进入 prompt、主动陪伴或章节。
      - 控制台只显示安全依据和审计元数据，所有修改通过确定性控制执行。
