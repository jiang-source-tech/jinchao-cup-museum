        - XIAOXIN-PROD-014
        - XIAOXIN-PROD-015
        - XIAOXIN-PROD-022
    - id: INT-05
      title: 硬件表达、状态与运行健康
      priority: P1
      status: partial
      focus: 让 ESP32 不只是播报文字，而是通过表情、状态页、通知、低功耗和健康诊断承载“小芯在身边”的存在感。
      implemented:
        - 固件已有宠物主页、通知中心、Overview、设置、低功耗和设备状态骨架。
        - Overview 已能消费服务端可选 companion/growth 投影，保持端侧不复制事实源。
      requirements:
        - 硬件只表现服务端安全投影，不在端侧推导年龄、关系、记忆或人格。
        - 情绪、表情和提醒表现要服务陪伴感，不能在学习压力或低落场景增加打扰。
        - 长稳、低电、离线、重连和 TTS 失败要有可诊断状态，不能只在服务器日志里可见。
      remaining:
        - 将人格/VA/关系姿态映射到有限表情和交互反馈，先做可控小集合，不追求复杂动画系统。
        - 完成 24 小时长稳、OTA 成功/回滚和设备异常恢复验收。
      acceptance:
        - 同一文本回复在硬件端有合理的播报、表情或状态反馈，不出现语义和视觉冲突。
        - 设备异常不会造成跨用户播报、重复主动陪伴或错误记忆写入。
