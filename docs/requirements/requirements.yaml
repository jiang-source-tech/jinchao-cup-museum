  - id: XIAOXIN-016
    title: 受控 OTA 固件发布、健康确认与回滚
    area: server
    module: ota-release-management
    milestone: M6
    status: partial
    priority: P0
    kind: runtime
    summary: 服务端和固件已经建立受控 OTA 发布骨架，覆盖不可变制品、发布选择、灰度、周期检查、安装安全、健康确认和回滚；完整真机发布证据仍未闭环。
    implemented:
      - 服务端以 SHA-256 保存不可变固件制品，并在 SQLite 中管理发布记录、状态、通道、目标型号、板型、分区布局和最低当前版本。
      - 发布选择支持设备允许名单和稳定哈希灰度百分比；发布可暂停，未发布或不匹配的制品不会进入 OTA 响应。
      - OTA 下载只允许读取已发布目录中的制品，设备上报的检查、offer、pending、committed、rolled_back 和 failed 结果进入无凭据审计记录。
      - "`scripts/publish_firmware.py` 已提供导入、发布、暂停、灰度、允许名单和审计查询命令。"
      - 固件已实现 16 MiB A/B OTA bootstrap、周期检查抖动、发布通道、最低电量门槛、SHA-256/目标身份校验、pending health window、确认和回滚。
      - 固件已将发现新版本、安装中和升级失败接入通知中心；服务端人工发布教程和速查表已经落地。
      - 2026-07-14 相关服务端选择测试 329 项、固件 OTA/遥测主机测试 88 项通过；这些结果证明代码与合同，不替代真机发布证据。
    remaining:
      - 用一台试验设备完成并归档 USB bootstrap、canary 发布、OTA 下载、重启、健康确认和运行版本回报。
