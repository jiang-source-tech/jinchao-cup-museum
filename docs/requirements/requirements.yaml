  - id: XIAOXIN-006
    title: 事件投递、ACK 与 MQTT 唤醒
    area: server
    module: delivery-wakeup
    milestone: M4
    status: partial
    priority: P0
    kind: runtime
    summary: 服务端控制台可以向设备投递通知事件；设备 MQTT 已覆盖 status、telemetry、wake 和 retained Overview。wake 使用 `device/{device_id}/notification`，遥测使用 `device/{device_id}/telemetry`，普通通知、课程提醒、待办提醒正文和 TTS 仍走 WebSocket。
    implemented:
      - 控制台文档定义 `/api/xiaoxin/events`、`/api/xiaoxin/deliveries` 等接口。
      - 当前服务端 MQTT wake 发布主题为 `device/{device_id}/notification`，payload 已收敛为纯 `{"type":"wake"}`。
      - 固件端存在 `SendXiaoxinAck` 和 `xiaoxin_event` 处理路径。
      - 控制台创建投递事件前会校验目标设备属于当前登录用户且处于 bound 状态。
      - delivery 列表和详情已按当前用户绑定设备过滤，不能读取其他账号设备的投递历史。
      - 已新增 `DoorbellCredentialStore`，为每台设备生成稳定高熵 MQTT credential，支持复用、轮换、禁用和 active 列表；内部历史命名空间不进入设备 topic 或业务 payload。
      - 已新增 Mosquitto `password_file` 与 `acl_file` 导出逻辑；服务端 ACL 包含 `topic write device/+/overview`，设备 ACL 包含精确的 `topic read device/{device_id}/overview`，并保留既有 status/notification 权限；生产 Broker 实际加载和真机订阅仍待验收。
      - 学生侧 wake 授权要求登录账号拥有已绑定设备；未绑定预置设备会被拒绝。
      - 诊断状态已区分 `doorbell_mqtt_disabled`、`doorbell_client_not_started`、`wake_publish_failed` 和 `device_not_bound`。
      - 服务端已新增设备级 `device/{device_id}/overview`，以 QoS 1 retained 发布 Overview v1 快照；通知正文、TTS、ACK 和播放完成态仍保持 WebSocket 边界。
      - Overview 发布已持久化 revision、pending/published 状态、尝试次数、下次重试、PUBACK 和安全诊断，并隔离 MQTT session generation 与过期 ACK。
      - 手动 Overview MQTT 重同步不要求设备有活动 WebSocket 连接；服务端自动测试覆盖无 WebSocket 调用路径、跨设备授权和失败隔离。
      - 真机台账已确认 `device_received` ACK、三类带播报投递的完成态、待机可唤醒投递、`wake_timeout` 与 `device_offline` 失败原因。
      - 最新服务端已将通知 TTS 的首句字幕控制帧从音频流控队列中移出，确保音频开始前可向设备发送关联 `sentence_id` 的 `sentence_start` 字幕帧。
      - 服务端 MQTT 客户端已订阅 `device/+/status` 和 `device/+/telemetry`，即使没有 WebSocket hello 也能更新设备在线状态、电池档位、电量百分比和固件版本。
      - Mosquitto ACL 已允许设备精确写入自己的 status/telemetry topic，并允许服务端读取全部设备 status/telemetry。
    remaining:
      - 固件端从 OTA 配置启动、持久化和重启复用 doorbell MQTT 已有代码与主机测试；仍需归档真实 broker、真机重启和凭据轮换证据。
      - 当前 `xiaoxin_control.doorbell_mqtt.password` 在配置契约中可为空；导出生产 Mosquitto auth 前必须补齐 server publisher credential。
      - 需要用端到端或半自动测试持续断言 MQTT 只负责状态、遥测、wake 和 Overview，普通通知、课程提醒和待办提醒正文走 WebSocket 投递链路。
      - "`tts_failed`、播放中断与用户打断仍需补自动化或半自动验证；`wake_timeout`、`device_offline` 和 `device_received` 已有真机确认。"
      - 完善 delivery timeline 在控制台中的可视化。
      - retained 快照接收、重新订阅恢复、offline reconnect 与无 WebSocket Overview 刷新已有单设备用户确认，仍需归档 broker 日志和屏幕证据。
      - 仍需两台真机证明精确 topic/ACL 的 cross-device isolation。
    optimizations:
      - 给演示控制增加一键触发课程提醒、待办提醒、普通通知。
      - 投递状态和固件 heads-up 显示可共享同一事件 id。
    acceptance:
      - 在线设备收到事件后进入 `device_received` 或 `done`。
      - 可唤醒设备先进入 `waking`，重连后进入 `sent`。
      - 已配置门铃 MQTT 时，断开 WebSocket 的离线/未知状态设备也先进入 `waking` 并尝试唤醒。
      - 未配置门铃 MQTT 的离线设备最终失败原因为 `device_offline`。
