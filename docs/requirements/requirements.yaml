project:
  name: 金潮杯博物馆展品语音讲解伙伴
  dashboard_title: 需求追踪与交付看板
  version: "0.1.0"
  updated_at: "2026-08-11"
  source_of_truth: docs/requirements/requirements.yaml
  objective: >-
    让游客主动说出展品并提问，系统以馆方审核事实完成可追溯的短语音讲解，
    支持自然追问、显式切换展品和资料不足兜底，并在真实 ESP32 设备上形成可复核闭环。
  status_rule: >-
    已完成只表示列出的验收条件全部具备证据；自动化测试通过不等同于真机验收通过。
  automated_baseline:
    command: >-
      python -m pytest -q tests/test_exhibit_resolver.py tests/test_query_understanding.py
      tests/test_museum_runtime.py tests/test_museum_conversation_eval.py tests/test_museum_text_chat.py
    result: 27 passed in 2.13s
    verified_at: "2026-08-11"

phases:
  - id: scope
    sequence: 0
    title: 范围冻结
    summary: 锁定产品边界、验收语言和唯一需求来源。
  - id: context
    sequence: 1
    title: 展品上下文
    summary: 从游客原话建立、继承或切换当前展品。
  - id: rag
    sequence: 2
    title: 可信回答
    summary: 限定当前展品和发布事实，生成可追溯且不越界的回答。
  - id: audit
    sequence: 3
    title: 审计与设备状态
    summary: 解释每轮绑定、依据、状态和终端反馈。
  - id: content
    sequence: 4
    title: 内容运营
    summary: 不改代码即可导入、校验、发布和回收未命中问题。
  - id: device
    sequence: 5
    title: 真机验收
    summary: 用真实麦克风、ASR、TTS、屏幕和扬声器形成证据链。
  - id: expansion
    sequence: 6
    title: 规模扩展
    summary: 核心闭环稳定后再扩展内容和可选能力。

