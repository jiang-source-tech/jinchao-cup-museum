        - XIAOXIN-PROD-021
        - XIAOXIN-PROD-022
        - XIAOXIN-PROD-023

mini_program_requirements:
  title: 学生侧小程序需求分栏
  summary: >
    当前小程序已经成为微信主体下的真实管理入口：openid 会话、设备绑定、课程、课前提醒、提醒事项、
    首页聚合、通知记录、设备电量/固件版本和校园导航均已接入真实服务端或硬件数据。
    下一步重点不再是静态页面或基础接线，而是补编辑闭环、语音创建提醒真机验收、聊天记录、生产网络和长期稳定性。
  current_state:
    - 已完成原生微信小程序入口、底部 Tab 和首页/课表/导航/记录/我的页面骨架。
    - 已完成手动课程新增、编辑、删除、本地存储、学期开始日期和当前周计算。
    - 已完成校园导航 Tab、清理后的校园底图、POI 搜索、内部路线图和路线摘要。
    - 已接入 MP-01：小程序 wx.login code 会话、启动会话 bootstrap、学生资料读取/保存、设备查询、激活码绑定、扫码识别绑定码、解绑接口，以及首页绑定入口跳转。
    - 已接入 MP-02 第一阶段：服务端课程表/学期配置 CRUD，小程序课程 API 服务端优先、缓存降级，并提供课程摘要接口。
    - 小程序已默认指向公网开发服务 `http://121.43.33.0:8003`，开发者工具可通过“不校验合法域名”继续测试；体验版/正式版仍需 HTTPS 域名、备案和微信后台 request 合法域名配置。
    - 提醒事项列表、新增、删除和通知历史已接入服务端真实数据；提醒编辑和聊天记录持久化仍未完成。
    - 首页和“我的”页已展示硬件上报的电池档位、电量百分比、固件版本和最近在线状态；缺失遥测时保持未知态，不伪造数据。
    - 课程页已提供学生级课前提醒设置，服务端按提前分钟数调度，并禁止课程开始后补发过期上课提醒。
  recommendation: >
    优先级从高到低是：完成 HTTPS 合法域名和正式微信登录配置；补提醒编辑、离线补发与语音创建真机验收；
    接入真实聊天记录；继续验证设备遥测新鲜度和首页状态一致性；最后再增强校园导航与视觉体验。
    已完成的真实数据接线不应继续写成待办，也不能因为缺少真机长稳证据就退回“尚未实现”。
  priority_order:
    - MP-00 后端连接诊断与发布网络闭环
    - MP-01 账号与设备绑定闭环
    - MP-02 课程表服务端同步
    - MP-03 提醒事项管理与投递状态
    - MP-04 首页真实状态聚合
    - MP-05 记录回看与通知历史
    - MP-06 校园导航后续增强
  columns:
    - id: MP-00
      title: 后端连接诊断与发布网络闭环
      priority: P0
      status: partial
      focus: 让开发、真机调试和上线前网络状态可见，先证明小程序真的连上服务端。
      implemented:
        - 小程序 `services/xiaoxinApi.js` 已内置公网开发 API 默认值 `http://121.43.33.0:8003`。
        - 小程序在没有本地 `xiaoxinOpenid` 时会使用开发 openid，便于开发者工具先跑通 session。
        - 已确认微信开发者工具本地测试可通过“不校验合法域名、TLS 版本以及 HTTPS 证书”绕过合法域名校验。
        - 服务端已新增 `GET /api/miniprogram/diagnostics`，返回 session、profile、device、semester、courses 和 curriculum overview 的后端健康检查结果。
        - 小程序“我的”页已增加连接诊断面板，展示 API 地址、openid、session token 状态、最近请求错误和 diagnostics 健康检查结果。
        - 小程序 API 层已记录最近一次请求错误，并区分未配置地址、域名校验拦截、服务端不可达、token 无效和业务接口失败。
      requirements:
        - 增加开发期连接诊断入口，显示当前 API 地址、openid、session token 是否存在、最近一次请求错误和接口健康检查结果。
        - 诊断入口至少能一键测试 session、profile、device、semester、courses 和 curriculum overview。
        - 诊断结果必须区分“未配置地址”“域名校验被拦”“服务端不可达”“未登录/token 无效”“业务接口返回失败”。
        - 发布前网络方案必须明确开发者工具、真机调试、体验版、正式版分别使用的地址、HTTPS 要求、微信后台 request 合法域名和备案状态。
      remaining:
        - 体验版/正式版不能继续使用 `http://121.43.33.0:8003`，需要稳定 HTTPS 域名、证书、反向代理和微信后台域名配置。
        - 需要把“开发默认地址”与“生产合法域名”区分清楚，避免上线包误用 HTTP IP。
      acceptance:
        - 开发者打开小程序后能直接看到当前是否连上服务端，不需要只靠 Network 面板判断。
        - 任一核心接口失败时，诊断结果能指出失败层级，而不是静默回退 mock。
        - 体验版/正式版发布前有明确的 HTTPS 合法域名检查项。
      related_items:
        - XIAOXIN-PROD-018
        - XIAOXIN-PROD-002
    - id: MP-01
      title: 账号与设备绑定闭环
      priority: P0
      status: partial
      focus: 把微信 openid、学生资料和硬件 device_id 绑定成稳定主体。
      implemented:
        - 服务端新增 `/api/miniprogram/session`，使用 openid 创建或读取本地微信主体并签发 session token。
        - 服务端新增 `/api/miniprogram/profile` 读取和保存学生资料。
        - 服务端新增 `/api/miniprogram/device`、`/api/miniprogram/device/bind` 和 `/api/miniprogram/device/unbind`，复用既有 identity device 绑定表。
        - 小程序 `services/xiaoxinApi.js` 支持真实 API 优先、mock 降级、启动会话 bootstrap，并持久化 session token。
        - 小程序 `app.onLaunch` 会优先调用 `wx.login` 获取 code，再交给服务端创建或读取学生会话；开发失败时保留本地 openid fallback。
        - 小程序 `app.globalData.sessionReady` 保存启动会话 promise；首页和“我的”页加载真实状态前会等待该 promise，核心远程 API 在无 token 时也会主动 bootstrap session，不再先返回 mock。
        - 服务端 `/api/miniprogram/session` 已支持用微信登录 code 换取 openid；测试和开发环境可用 `miniprogram_code_openid_map` 显式映射，正式环境可配置小程序 appid/secret 调用微信 `jscode2session`。
        - 小程序“我的”页支持资料编辑保存、6 位绑定码输入、扫码识别绑定码、开发后备 device_id 输入、绑定和解绑。
        - 小程序首页未绑定状态和顶部绑定入口已跳转到“我的”页绑定面板。
        - 小程序 API 已归一化激活码绑定返回的 `device_id/display_name/bind_status` 字段，绑定成功后页面能稳定读取 `deviceId/name/bound`。
        - 小程序首页远端聚合接口失败时不再静默回退 mock，而是展示同步失败、重试和账号连接入口。
      requirements:
        - 小程序启动后通过微信登录拿到 openid，并在服务端创建或读取本地微信主体。
        - 资料页支持昵称、学号、学院、专业、班级、年级等可选资料的保存。
        - 支持扫码或输入绑定码绑定一台硬件设备，并能解绑但不删除个人宠物记忆。
        - 首页和我的页面展示真实设备在线状态、电量、固件版本和最后在线时间。
      remaining:
        - 固件、服务端和小程序的电池档位、电量百分比、固件版本链路已完成；仍需真实设备长时间验证上报频率、断线恢复、陈旧值失效和跨设备隔离。
        - 正式发布前需要配置小程序 appid/secret、HTTPS 合法域名和微信后台 request 合法域名，避免继续依赖开发 fallback。
        - 明确设备换新或维修时，个人宠物和记忆跟随微信主体，不跟随旧设备。
      acceptance:
        - 一个 openid 能稳定对应一个本地微信主体，但不宣称完成学生身份认证。
        - 学生能在小程序中完成设备绑定、查看状态和解绑。
        - 课程表、提醒、记录和个人宠物都归属微信主体，而不是直接归属设备。
      related_items:
        - XIAOXIN-PROD-002
        - XIAOXIN-PROD-003
        - XIAOXIN-PROD-004
    - id: MP-02
      title: 课程表服务端同步
      priority: P0
      status: partial
      focus: 把当前本地课程表迁移成微信主体下的服务端课程表。
      implemented:
        - 服务端新增 `/api/miniprogram/semester` 读取和保存学生学期配置。
        - 服务端新增 `/api/miniprogram/courses` 和 `/api/miniprogram/courses/{course_id}`，支持微信主体下课程创建、读取、更新、删除。
