companion_growth_requirements:
  title: 陪伴成长需求分栏
  summary: >
    V2 以一个深模块 CompanionMind 统一实时记忆、关系时期、确定性策略、异步整理、用户控制和多端投影。
    学生年级驱动的小芯年龄、真实相处时长和关系阶段必须保持独立；长期判断必须有 Evidence、可纠正、可删除。
  current_state:
    - 已有微信 openid、本地微信主体、设备绑定和稳定 memory_subject_id，个人记忆不必跟随单台设备；当前没有学校认证学生账号。
    - 服务端已完成 replace-not-layer 切换，`CompanionMind` 是实时、控制、投影和后台整理的唯一记忆 interface；旧 memory 包、旧配置、旧 API、旧文件写入和主题状态机已删除。
    - 唯一默认事务事实源为 `data/xiaoxin_companion.db`；Evidence、relationship epoch、调整、章节、主动陪伴和控制审计使用同一 SQLite/WAL。
    - 学生资料中的当前年级是小芯年龄唯一事实源；大一到大四映射 1 到 4 岁，未知为 `null`，大二首次使用仍从 `first_meeting` 开始。
    - ReflectionModel 只在后台 worker 运行，失败进入 retry，不阻塞聊天、提醒或设备功能。
    - 控制台已完成 operator 专用的开发者记忆工作台：提供设备到 personal pet、memory subject 和 relationship epoch 的归属链，最多 250 条 Evidence 时间线，覆盖 active、candidate、superseded、forgotten、expired 等 inactive 状态，并展示 Capsule、Adjustment、Chapter、Evidence relation 血缘及 Evidence/job 状态计数。
    - 开发者记忆工作台提供纠正 Evidence、忘记 Evidence、按主题遗忘、设置边界、撤销边界、候选确认、候选拒绝、关系重置和彻底清除个人记忆九类确定性控制；reset 与 purge 要求显式确认，miniprogram 投影字段和权限保持不变。
    - CG-YEAR-01 已完成学生侧低存在感消费：小程序首页展示年级年龄与安全成长摘要，固件通过兼容 Overview v1 的可选 `companion` 字段展示成长卡；两端不建立本地成长事实源。
    - 已新增 `personal_pets` 生命周期事实源；它负责归属和真实相处起点，不负责小芯年龄或关系阶段。
    - "Slice 0 切换前回归基线：在 `main/xiaozhi-server` 运行 `python -m pytest tests/xiaoxin -q`，结果为 1848 passed；在仓库根目录运行旧 requirements workbench，结果为 10 passed。"
    - "Slice 13 加开发者记忆工作台后的当前服务端基线：六个黄金故事 6 passed，`python -m pytest tests/xiaoxin -q` 为 1027 passed，requirements workbench 为 14 passed。"
    - "2026-07-20 CP-01 第一阶段基线：新增 Observation→Evidence 统一入口、schema v5、待办/语音提醒/可靠 TTS Adapter 和独立 reminder_status；`python -m pytest tests/xiaoxin -q` 为 1067 passed，Companion 相关 224 passed；V2 真机 smoke 仍未执行。"
    - 仍需真实数据校准关系阈值、Evidence 保留期、主动陪伴频率和硬件表达强度；这些校准项不改变当前服务端事实源与安全合同。
    - 2026-07-25 已冻结 `CG-IND-01` 个体人格与长期成长 V1 规格和实施计划；现有 CompanionMind 是唯一实现基线，隔离原型不算生产完成，五轴出生气质、长期关系姿态、完整四学年叙事和 VA 已进入生产实现线，仍需更长时段真机和压缩纵向验收校准。
    - 2026-08-03 已用两台已绑定真实设备完成双主体文字输入、真机输出链路验收：A 主体自然召回嵌入式课程设计/驱动调试主线，B 主体自然召回数字钢琴考级/模拟上台紧张主线；该结果证明主体隔离和差异召回主路径可用，但不等同于长期真实用户校准完成。
  recommendation: >
    服务端第一阶段按 V2 Slice 0-13 完成后，下一步只建设真实消费者和校准闭环：
    小程序与固件必须消费现有投影，不得复制事实源、恢复旧 memory 或用 UI 字段重新推导年龄和关系。
  priority_order:
    - CG-00 主体、年龄与关系事实源
    - CG-01 CompanionMind 实时提交合同
    - CG-02 Evidence 生命周期与关系时期
    - CG-03 关系阶段与确定性陪伴策略
    - CG-04 会话胶囊、自我调整与陪伴章节
    - CG-05 有依据主动陪伴与反馈闭环
    - CG-06 学生年级、小芯年龄与跨阶段回望
    - CG-07 CompanionMind 多端投影与体验验收
    - CG-YEAR-01 大一到大二成长可感知闭环
    - CG-IND-01 个体人格与长期成长 V1
  columns:
