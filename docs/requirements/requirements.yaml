meta:
  title: 小芯项目状态工作台
  display_title: Xiaoxin 项目状态工作台
  source_file: docs/requirements/requirements.yaml
  version: 0.17.0
  updated: 2026-08-03
  owner: Liu Haojiang
  description: >
    Xiaoxin / 小芯 AI Pet 的项目总状态工作台。YAML 是唯一事实源，
    HTML 页面只负责把服务端、固件、产品路线、风险和证据可视化。

taxonomy:
  statuses:
    done: 已完成
    partial: 部分完成
    active: 进行中
    todo: 待实现
    optimize: 可优化
    blocked: 阻塞
    deferred: 暂缓
  areas:
    server: 服务端
    firmware: 固件端
    product: 产品路线
    ops: 部署运维
    docs: 文档治理
  kinds:
    feature: 功能
    architecture: 架构
    data: 数据
    ui: 界面
    runtime: 运行时
    test: 测试
    documentation: 文档
    product_requirement: 产品需求
    risk: 风险
  priorities:
    P0: 最高
    P1: 高
    P2: 中
    P3: 低
  confidence:
    high: 高
    medium: 中
    low: 低
    unknown: 未知

repositories:
  - id: xiaoxin-server
    name: xiaoxin-esp32-server
    path: D:\AI_Pet\xiaoxin-esp32-server
    role: 私有服务端、语音链路、控制台、身份记忆、OTA/WebSocket 配置。
    notes: 当前工作台主入口所在仓库；本轮更新依据当前 workspace 实际代码状态。
  - id: xiaoxin-firmware
    name: hzcu_xiaoxin_firmwire_private
    path: D:\AI_Pet\hzcu_xiaoxin_firmwire_private
    role: ESP32-S3 Touch LCD 1.46 固件、宠物 UI、通知中心、低功耗与设备状态。
    notes: 已有固件功能地图，可作为本工作台的固件证据来源。
  - id: xiaoxin-miniprogram
    name: Hzcu_xiaoxin_miniprogram
    path: D:\AI_Pet\小程序\Hzcu_xiaoxin_miniprogram
    role: 学生侧微信小程序，承载账号资料、设备绑定、课程表、提醒事项、校园导航、记录回看和个人设置。
    notes: 已有首页、课表、课程编辑、校园导航、记录、提醒和我的页面 MVP；下一阶段重点是接入真实微信 openid 主体与服务端数据。
  - id: ai-pet-chat-debugger-reference
    name: ai-pet-chat-debugger requirements reference
    path: D:\AI_Pet\ai-pet-chat-debugger\docs\requirements
    role: YAML 到 HTML 的本地可视化参考实现。
    notes: 本工作台复用其三件套思路，但内容模型面向 Xiaoxin 全项目。

modules:
  - id: voice-runtime
    name: 服务端语音链路
    area: server
    description: ESP32 WebSocket 接入、音频流、VAD、ASR、LLM、工具调用、TTS 和音频返回。
  - id: ota-websocket-paths
    name: OTA 与 WebSocket 私有路径
    area: server
    description: Xiaoxin 私有 OTA、WebSocket 路径和部署配置。
  - id: ota-release-management
    name: 受控 OTA 发布与回滚
    area: server
    description: 固件制品、发布通道、灰度、允许名单、审计、周期检查、健康确认和回滚。
  - id: xiaoxin-runtime-memory
    name: Xiaoxin runtime 与 CompanionMind
    area: server
    description: Xiaoxin 专用 runtime、统一 Companion Evidence、关系 epoch、确定性策略、异步整理、控制与多端投影。
  - id: identity-control-console
    name: 8003 Xiaoxin 控制台
    area: server
    description: 独立账号、设备绑定、说话人、记忆主体和本地 SQLite 身份中心。
  - id: delivery-wakeup
    name: 投递、ACK 与 MQTT 唤醒
    area: server
    description: 服务端主动事件投递、设备 ACK、门铃 MQTT 唤醒和投递状态机。
  - id: pet-home
    name: 宠物主页
    area: firmware
    description: 泡泡宠物 GIF、触摸、摇晃、服务端情绪和设备事件映射。
  - id: notification-center
    name: 通知中心
    area: firmware
    description: 真实通知事件仓库、通知卡片、heads-up、优先级、清理和业务提醒。
  - id: overview
    name: Overview 总览页
    area: firmware
    description: 天气、课程、待办、时间、网络、电量和设备状态摘要。
  - id: local-settings
    name: 本机设置页
    area: firmware
    description: BOOT 长按入口、亮度、Wi-Fi 重新配网、关于页和省电开关。
  - id: low-power-health
    name: 低功耗、电池与运行健康
    area: firmware
    description: 电量 ADC、低功耗时钟、深睡唤醒、关机、运行健康诊断。
  - id: server-data-sync
    name: 服务端数据接入与演示控制
    area: product
    description: 天气、课程、待办、通知、提醒和宣传演示按钮从服务端下发到设备。
  - id: requirements-workbench
    name: 项目状态工作台
    area: docs
    description: 本 YAML、HTML 和本地 server.py 组成的项目总账。
  - id: deployment-ops
    name: 部署与运维
    area: ops
    description: 本地运行、服务器部署、配置路径、模型供应商和验证命令。
  - id: product-risks
    name: 产品化风险
    area: product
    description: 真实数据、身份隔离、低功耗、长期稳定和小屏交互风险。
  - id: configuration-security
    name: 配置与密钥治理
    area: ops
    description: API 密钥、服务端凭据、部署私有配置和仓库示例配置的隔离与轮换。
  - id: product-positioning
    name: 大一新生陪伴型电子宠物
    area: product
    description: 小芯作为面向大一新生的 AI 陪伴型电子宠物，核心价值是情绪陪伴、长期记忆和每个 pet 的可感知个体差异。
  - id: student-identity-product
    name: 微信主体与设备绑定
    area: product
    description: 微信 openid、学生资料、个人宠物和硬件设备绑定关系。
  - id: personal-pet-product
    name: 个人宠物养成
    area: product
    description: 第一版外观统一，差异来自学生年级驱动的年龄形态、可靠 Evidence、关系阶段、自我调整、互动习惯和主动陪伴策略。
  - id: companion-growth-runtime
    name: 陪伴成长运行时
    area: server
    description: CompanionMind 实时提交、个人小芯主体上下文、确定性 CompanionPolicy、可解释 Evidence 和陪伴章节。
  - id: companion-growth-product
    name: 陪伴成长产品体验
    area: product
    description: 学生年级驱动的小芯年龄、关系阶段行为差异、可解释陪伴章节和可控制的有依据主动陪伴。
  - id: curriculum-product
    name: 课程表与课程提醒
    area: product
    description: 小程序手动课表、课程提醒、硬件总览和错过提醒记录。
  - id: reminder-product
    name: 提醒事项与语音创建提醒
    area: product
    description: 小程序手动提醒、硬件语音创建提醒、到点投递和离线补发规则。
  - id: mini-program-product
    name: 学生侧小程序
    area: product
    description: 设备绑定、宠物状态、课表、提醒、校园导航、聊天记录、通知历史和个人设置。
  - id: campus-navigation-product
    name: 校园导航
    area: product
    description: 小程序校园地图、建筑地点、课表教室联动和校内路线指引。

