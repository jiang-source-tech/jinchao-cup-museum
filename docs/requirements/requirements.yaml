    - id: CP-SEM
      title: 语义记忆采集、分级写入与自然召回
      priority: P0
      status: active
      focus: 用带原文证据的多轮语义理解取代正则画像主路径，并让主对话模型通过受策略约束的内部记忆工具规划召回；模型负责理解，确定性 CompanionMind 负责归属、风险、生命周期和最终写入。
      implemented:
        - 现有 CP-02 已提供可复用的异步 worker、短期 turn source、严格结构化输出、逐字引用验证、candidate 生命周期、确认/拒绝、冲突替代和终态原文擦除，不需要新建平行 MemoryEngine。
        - 现有 CP-03 已提供可复用的 fact key、SQLite FTS5 trigram、主体/状态/时期/敏感度硬过滤、确定性重排和 digest-only 召回审计，可继续作为语义召回后的候选生成与安全执行层。
        - 当前缺口已定位：memory_candidate_extraction 只读取当前 turn；value 必须是 source_quote 子串，无法区分原文证据与规范化画像值；生产 worker 默认关闭。
        - 当前 turn_analysis.py 仍直接生成 profile_fact、explicit_preference 和 user_life_event，_companion_retrieval_hints() 仍以固定关键词生成 fact key/kind 提示，二者都不满足自然陪伴表达覆盖。
        - operator 已有 candidate 审核、Evidence 生命周期、召回审计和 worker 诊断基础，可作为 shadow/candidate 阶段评估面；CP-06 将补学生侧低负担确认和纠错。
        - 阶段 0 已新增 semantic_memory 深模块：MemoryInterpreter 通过注入的 MemoryInterpretationModel 接收多轮请求并验证规范化 proposal；MemoryRecallPlanner 把主模型的自然记忆工具请求收敛为不超过两条的确定性召回计划。
        - MemoryInterpreter 合同已覆盖 confirmed subject、最多六条/3000 字/30 分钟上下文、最多八条冲突事实、用户原文引用、assistant 禁止归因、多 quote、claim type、subject scope、temporal scope、ASR 可靠性和 momentary valid_until。
        - MemoryRecallPlanner 合同已覆盖自然 query 无关键词依赖、general QA/unknown speaker/零预算失败关闭、initiative 强制排除 sensitive、fact key/kind/time/sensitivity 白名单和最多两条预算。
        - 阶段 0 当时新增 44 个 CP-SEM interface 测试并冻结基线；后续阶段已在同一深模块上继续实现，没有新建平行 MemoryEngine。
        - 阶段 1 已完成 schema v12：CompanionTurnRequest/PreparedCompanionTurn 带会话 digest，companion_context_messages 按 pet/subject/conversation 隔离保存最近三组消息，具备 30 分钟/3000 字上限、job pin、lease 校验、terminal 释放、TTL 以及 forget/reset/purge 清理。
        - v11→v12 启动迁移会在数据库旁创建 pre-v12 SQLite 在线备份，迁移后强制执行 integrity_check 和 foreign_key_check；旧库迁移、pin 释放和上下文过期已有自动化覆盖。
        - 阶段 2 已完成生产 LLMMemoryInterpretationModel：严格 JSON 和字段白名单、多 user source quote、canonical_value 分离、existing facts、assistant 禁止归因、超时及非法输出失败关闭；实时 commit 不包含远程解释调用。
        - 阶段 3 已完成确定性 MemoryWritePolicy 和 Store 事务：第三方/否定/假设/转述/玩笑/梦境丢弃，ASR/推断/敏感/短期/冲突等待确认，candidate 去重且不可进入 prompt，确认/拒绝/纠正/遗忘沿用 Evidence 血缘；terminal 后擦除原文 quote，仅保留 source turn 和 digest。
        - 阶段 4 已完成 runtime 接入和正则画像退役：semantic mode 开启时，profile_fact、explicit_preference、user_life_event 不再进入自然语音主写路径；关系直接反馈和安全控制保留；模型不可用时失败关闭而不恢复正则画像。
        - 阶段 5 已完成主 LLM 单工具自然召回：首轮直接注册 recall_companion_memory，模型不调用时零额外远程请求；调用时由 MemoryRecallPlanner 和 CompanionMind 执行主体、一般问答、预算、敏感度、状态和 top-2 门禁，再以安全摘要进行一次最终回答。
        - 阶段 6 已完成无原文观测：semantic_memory_evaluations 记录 proposal/action/reason/claim/conflict、正则 shadow digest/count、延迟、模型和 release guard；operator 同时投影 backlog、短期 context/pin、召回审计和语义评估，不暴露模型思维过程或用户原文。
        - 阶段 7 已完成 CP-06 服务端交接合同：miniprogram 只获得待确认候选的安全摘要、用户可理解的安全依据、时效和 confirm/reject/correct/delete 动作，不获得内部 reason code、claim type、quote、confidence、Evidence 工程诊断或完整画像标签；既有确定性控制继续负责实际修改。
        - 阶段 8 已完成发布和回滚机制：off/shadow/candidate/active_explicit 独立配置，默认 off；active_explicit 另有默认关闭的 release gate，未放行时强制 candidate；backlog/错误率越界自动降级，初始化失败保持自然画像失败关闭，主动 scheduler/delivery 不联动开启。
      requirements:
        - 建立深模块 MemoryInterpreter，外部 interface 只暴露 interpret(MemoryInterpretationRequest) -> MemoryInterpretationResult；调用方不感知提示词、模型供应商、JSON 解析、引用验证、事实键归一化或冲突规则。
        - MemoryInterpretationRequest 只包含 confirmed memory subject、当前用户 turn、同一短期会话的受限上下文、ASR 可靠性元数据和少量可能冲突的当前 Evidence；unknown speaker、跨 owner 和 persistence_allowed=false 时不得创建请求。
        - 多轮上下文最多包含当前与前两组用户/助手交互、只选择同一 pet、memory subject 和会话 digest、时间跨度不超过 30 分钟、总文本不超过 3000 字；助手文本只允许消解指代，不得成为用户事实来源。
        - 在下一版 schema 中增加独立短期 companion_context_messages 和 job-source pin 关系；user/assistant 均带 role、turn、subject、会话 digest、文本 digest、发生时间和 expires_at。job terminal 时释放 pin 并擦除当前提取专用 source，滚动上下文最多保留 30 分钟；forget、reset、purge 和定时清理必须删除对应消息。
        - MemoryInterpretationResult 最多返回 5 条结构化 proposal，每条至少包含 kind、规范化 fact key、canonical_value、一个或多个 user source refs/quotes、claim_type、temporal_scope、sensitivity、confidence 和 reason code；不返回或持久化模型思维过程。
        - source_quote 必须逐字存在于对应 user source；canonical_value 与原文证据分离，不再强制为 quote 子串，但任何规范化值在自动激活前必须通过受限类型、证据充分性、归属和发布模式门禁。
        - claim_type 至少区分 explicit_statement、inference、reported_speech、hypothetical、negated、dream、joke 和 asr_uncertain；temporal_scope 至少区分 momentary、episode 和 stable，短期状态必须设置 valid_until，不能永久人格化。
        - 模型不得直接调用 Store。确定性 MemoryWritePolicy 根据主体、claim type、敏感度、冲突、ASR、证据完整度和发布模式决定 drop、shadow、candidate 或 active；模型 confidence 不能单独决定 active。
        - 初始发布模式固定为 off -> shadow -> candidate -> active_explicit。shadow 不写 Evidence，candidate 一律 prompt_eligible=false；只有 CP-06 纠错入口上线且 CP-07 数据门槛达标后，明确、非敏感、稳定、无冲突的白名单事实才可 active。
        - inference、敏感事实、第三方转述、冲突事实、玩笑/梦境/假设/否定和 ASR 可疑内容永不自动 active；它们必须丢弃、短期化或等待用户确认。
        - turn_analysis.py 中 profile_fact、explicit_preference 和 user_life_event 在 semantic candidate 达标后退出自然语音主写路径；只保留关系直接反馈、遗忘/重置/关闭等控制、安全校验和结构化业务 Observation。语义模块不可用时失败关闭，不回退为正则画像主路径。
        - 建立深模块 MemoryRecallPlanner，优先复用主对话 LLM 的 function calling，而不是增加串行前置分类模型；通过单一内部工具 recall_companion_memory 接收自然查询和有限结构化约束，再交由 CompanionMind 执行权限、预算、敏感度和状态过滤。
        - recall_companion_memory 最多返回两条安全摘要，不返回原始私密原文、候选、旧 epoch 或其他主体 Evidence；general QA、memory budget=0 和 initiative sensitive 场景即使模型请求也必须返回空。
        - 现有 fact key、FTS5 和确定性重排继续作为第一阶段检索实现；只有真实同义改写评估证明候选召回不足时才在 MemoryRecallPlanner 内部增加 embedding Adapter，不改变 CompanionMind 外部 interface。
        - 增加 companion_memory_interpreter_mode=off|shadow|candidate|active_explicit 配置；它与 worker、主动 scheduler 和 delivery 分开控制，模型初始化失败、backlog 超限或错误率越界时可独立退回 candidate/off。
      implementation_plan:
        - "阶段 0｜已完成｜基线与合同：冻结当前 150 个候选/召回/turn analysis 回归，新增 44 个 interface 黄金行为测试，覆盖直接陈述、改写、多轮指代、纠正、否定、假设、转述、玩笑、梦境、ASR 可疑、短期状态、敏感事实和主体门禁；MemoryInterpreter/MemoryRecallPlanner 已作为公开 interface 导出。"
        - "阶段 1｜已完成｜短期上下文：schema v12、会话 digest、最近三组消息、30 分钟/3000 字、job pin/lease、terminal 释放及 forget/reset/purge/TTL 清理。"
        - "阶段 2｜已完成｜语义解释：生产 LLM Adapter、严格结构化协议、多 user quote、canonical_value、claim/temporal/sensitivity/subject 字段和失败关闭。"
        - "阶段 3｜已完成｜确定性写入：MemoryWritePolicy、冲突/重复检测、短期 valid_until、候选生命周期、原文终态擦除和既有确认/纠正/遗忘血缘。"
        - "阶段 4｜已完成｜接入与正则退役：semantic mode 下自然画像只走异步解释器，旧正则仅保留控制、安全和关系直接反馈，解释器故障不回退。"
        - "阶段 5｜已完成｜自然召回：主 LLM 单工具 function calling、MemoryRecallPlanner、CompanionMind policy、FTS/reorder、安全 top-2 和 final response 闭环。"
        - "阶段 6｜已完成｜可观测与评估：无原文语义评估、shadow digest/count、原因/claim/conflict/latency/model、backlog/context/pin 和召回审计 operator 投影。"
        - "阶段 7｜已完成服务端合同｜CP-06 交接：miniprogram 待确认安全投影与 confirm/reject/correct/delete 控制已具备；具体低存在感页面仍归 CP-06。"
        - "阶段 8｜已完成工程门禁｜渐进发布：独立模式、v12 自动备份/完整性检查、active release gate、backlog/error 自动降级和配置回滚说明已完成；真实 shadow 样本门槛仍需部署后采集。"
      remaining:
        - 工程实现已完成；部署后按 off→shadow→candidate 顺序采集并人工复核至少 500 条自然候选，形成真实 precision、严重错误、第三方误归因、短期永久化和事实键重复报告。
        - 用真实同义改写离线集验证 explicit recall top-2 不低于 90%；若 FTS 候选生成不足，再在 MemoryRecallPlanner 内增加 embedding Adapter，禁止降低主体或敏感度门禁换指标。
        - CP-06 完成低存在感学生侧页面并达到 candidate-only 人工门槛后解除产品发布阻塞；active_explicit 必须同时满足 99% precision、严重错误为零和 companion_memory_active_explicit_release_enabled 人工放行，当前默认保持关闭。
      acceptance:
        - “图书馆三楼待着舒服，宿舍总有人讲话”等非模板表达能形成有逐字用户证据的学习环境偏好候选，不要求出现“我喜欢”。
        - “还是听力最让我头疼”能在同一短期会话中关联“准备六级”，但助手提问内容本身不会变成用户事实。
        - 否定、假设、转述、玩笑、梦境、ASR 可疑和敏感事实自动 active 数量为零；unknown speaker、跨 owner、跨 memory subject 写入和召回数量为零。
        - canonical_value 可以规范化自然表达，但每条 proposal 都能追溯到一个或多个真实 user quote；不存在引用伪造、assistant-as-user 或无来源画像。
        - semantic 模块关闭或故障时，对话、提醒和设备功能继续可用，但自然画像失败关闭，不回退成正则主采集。
        - “上次让我紧张的考试”“我之前说过最受不了的学习环境”等同义或指代表达能通过内部召回工具命中相关当前 Evidence；一般问答零私人注入。
        - 实时 commit 不等待 MemoryInterpreter；未触发召回工具的回合不增加远程调用，触发时最多增加一次受限工具往返且有超时和 token 上限。
        - shadow/candidate 阶段至少人工复核 500 条自然候选；进入 active_explicit 前明确非敏感白名单 precision 不低于 99%，且严重错误记忆、敏感自动激活、第三方误归因和跨主体污染均为零。
        - 自然表达离线集的 explicit recall top-2 命中率不低于 90%，错误私人注入率为零；未达到时保持 candidate-only，不用降低主体和敏感度门禁换取指标。
        - 所有新 schema 在迁移前完成 SQLite 在线备份；旧库可迁移、当前库 integrity_check=ok、foreign_key_check 无违规，回滚只切换模式不反向写旧格式。
      related_items:
        - XIAOXIN-PROD-023
        - XIAOXIN-003
        - XIAOXIN-019
        - XIAOXIN-PROD-021
        - XIAOXIN-PROD-022
    - id: CP-06
      title: 小程序、控制台与硬件消费
      priority: P0
      status: partial
      focus: 以最低存在感提供必要的记忆修复权和主动陪伴控制权，让成长通过对话与少量回顾自然体现，而不是把陪伴产品做成记忆、成长、主动三个管理后台。
      implemented:
        - operator 开发者工作台已支持 Evidence、epoch、Capsule、Adjustment、Chapter、job、血缘和七类控制。
        - miniprogram、hardware 和 initiative 服务端投影已存在，但学生侧页面和固件 V2 消费未完成。
      requirements:
        - 小程序默认只提供一个低存在感的“陪伴设置”入口，承载主动陪伴开关、频率、静默时段和私人话题尺度；不为“主动陪伴”建立独立一级板块。
        - 重要有效记忆、待确认候选、安全摘要、纠正、删除和禁止主动使用放入二级“记忆与隐私”入口；它是错误修复和隐私控制面，不是要求用户日常维护的画像后台。
        - 成长不作为可配置或可升级的管理对象，主要通过对话内自然表达、用户主动询问时的阶段回顾，以及少量可关闭的章节或纪念卡体现；不建立常驻成长页、等级进度条或任务化升级机制。
        - 学生侧不得展示关系阶段数字、continuity/knowledge/helpfulness/attunement 四维、Evidence ID、置信度、opportunity/decision 状态、原始模型输出、完整私密原文或“还差几次升级”等工程信息。
        - 硬件第一阶段只消费 neutral、warm、supportive、celebration 和 quiet_checkin 等有限表达；关系阶段只控制强度上限。
        - 所有端只消费 CompanionMind 投影，不在端侧复制事实源或重新推导关系。
      remaining:
        - CP-SEM 是学生侧候选确认和自然回顾的前置；必须先完成 semantic shadow/candidate 闭环，CP-06 不为当前窄正则事实制作画像管理界面。
        - 设计并实现一个低存在感陪伴设置入口、一个二级记忆与隐私入口，以及待确认候选流程；明确不拆成记忆、成长、主动三个一级页面。
        - 在对话回顾和可关闭的轻量章节/纪念卡中消费成长投影，不显示内部阶段数字或成长进度。
        - 为主动消息提供“有帮助、没帮助、太主动、太私人”和关闭入口，让反馈发生在上下文中而不是要求用户进入管理页。
        - 扩展 operator 召回原因、Observation-Evidence 血缘、关系四维、opportunity 和 worker 健康诊断。
        - 固件接入轻量硬件表达并验证不会阻塞通知、提醒和语音。
      acceptance:
        - CP-SEM candidate-only 已通过自动化和人工 shadow 评估；页面展示的待确认项来自带用户原文证据的语义 proposal，而不是新增端侧正则标签。
        - 用户不进入任何管理页面也能完成正常陪伴使用，并从减少重复询问、合适的记忆引用和自然回顾中感到成长。
        - 用户需要修复时能从二级入口查看一条重要记忆的安全摘要，并立即纠正、删除或禁止主动使用。
        - 用户能在低存在感设置中关闭主动陪伴、调整频率和静默时段，也能直接在主动消息上下文中反馈越界。
        - 学生侧不出现关系阶段数字、内部四维、Evidence/opportunity 工程字段或升级进度；小程序、硬件和语音的行为仍保持一致。
      related_items:
        - XIAOXIN-PROD-023
        - XIAOXIN-PROD-021
        - XIAOXIN-PROD-022
        - XIAOXIN-PROD-013
    - id: CP-07
      title: 真机、真实用户校准与发布门禁
      priority: P0
      status: todo
      focus: 用真实 ESP32、真实语音、真实待办提醒和自然跨日使用证明记忆准确、关系可感知、主动陪伴可接受，而不是只证明服务端合同能运行。
      implemented:
        - 现有自动化测试覆盖身份隔离、关系重置、模型失败、Evidence 删除、主动反馈和多端投影合同。
        - 真机验收台账已有 MEM-V2-01 至 MEM-V2-06 场景，但当前统一为未执行。
      requirements:
        - 增加明确称呼重启召回、复杂未来事件、事实纠正、跨学生隔离、真实 followup、主动拒绝、关系重置和 worker 离线恢复真机场景。
        - 建立语义 proposal precision/漏记率、claim type 混淆、第三方误归因、短期状态永久化、显式召回 top-2 命中、错误私人注入、关系变化原因、主动回复/拒绝/关闭和 worker backlog 指标。
        - 按 observation ingest、FTS shadow、semantic memory shadow、candidate-only、CP-06 纠错入口、active_explicit、relationship v2、initiative dry-run、真实投递顺序渐进上线。
        - 每次 schema 迁移前备份并校验 SQLite；禁止 V4/V5/V6 双写和新数据反向写旧格式。
      remaining:
        - 执行并归档所有 MEM/REL/INIT 黄金故事的设备、主体、时间、commit、schema 和安全日志证据。
        - 完成一轮真实用户自然使用校准，再确定关系门槛、Evidence 保留期、主动频率和硬件表达强度。
        - 建立明确回滚步骤和发布停止条件。
      acceptance:
        - 语义明确事实 precision、自然表达 top-2 召回、forgotten/superseded/跨 owner 错误召回和一般问答私人误注入达到 CP-SEM 与本阶段发布门槛。
        - 关系变化能够解释到真实 Evidence，主动陪伴能够解释到 opportunity 和最终反馈。
        - 任一错误记忆、越界主动、重复投递、跨学生泄漏或虚构共同经历都会阻止发布。
