risks:
  - id: RISK-001
    title: 服务端和固件状态不同步
    severity: high
    summary: Xiaoxin 横跨两个仓库，如果总工作台不持续维护，固件路线和服务端路线会再次分裂。
    impact: 后续任务可能重复规划、漏掉依赖，或把服务端能力误认为固件能力。
    mitigation:
      - 所有跨端能力先进入本 YAML，再进入具体计划。
      - 固件仓库功能地图作为证据来源，不作为总入口替代品。
    related_items:
      - XIAOXIN-014
  - id: RISK-002
    title: 未知说话人造成记忆污染
    severity: high
    summary: 核心工程风险已通过 `memory_subject_id`、unknown speaker 零私人读写和失败关闭归因门禁降低；剩余风险主要来自未来声纹识别误判和自然语言同轮冲突语义。
    impact: 如果确认说话人错误或把第三方语境误判为直接自述，仍可能污染长期 Evidence；同一 turn 内互相矛盾的来源或偏好当前取首个直接匹配。
    mitigation:
      - 已实现 `memory_subject_id` 身份解析。
      - SQLite 身份不可用时宁可降级不持久化，也不写入全局 scope。
      - unknown speaker 零私人读写，第三方转述、非事实语境和未知前缀失败关闭。
      - 旧数据只读归档，不运行时导入、不自动强迁。
      - 后续补声纹稳定识别、误识别审计和同轮冲突取舍合同。
    related_items:
      - XIAOXIN-003
      - XIAOXIN-005
  - id: RISK-003
    title: 小屏交互过载
    severity: medium
    summary: 1.46 寸圆屏不适合复杂表单和高密度文本，过多本机配置会破坏体验。
    impact: 用户难以操作，固件 UI 文件继续膨胀。
    mitigation:
      - 本机只做高频轻操作。
      - 复杂输入放到服务端控制台或 Web 配置面板。
    related_items:
      - XIAOXIN-010
      - XIAOXIN-012
  - id: RISK-004
    title: 演示数据无法平滑迁移到真实业务数据
    severity: medium
    summary: 如果演示控制和真实数据源使用不同事件接口，后续会推翻固件接入方式。
    impact: 宣传视频可用但产品化返工。
    mitigation:
      - 演示数据和真实数据都通过同一套 `xiaoxin_overview_update` 和 `xiaoxin_event` 结构下发。
    related_items:
      - XIAOXIN-008
      - XIAOXIN-009
      - XIAOXIN-012
  - id: RISK-005
    title: 设备 MQTT 传输边界
    severity: medium
    summary: MQTT 按 `device/{device_id}/status`、`device/{device_id}/telemetry`、`device/{device_id}/notification` 和 `device/{device_id}/overview` 隔离。status 表示在线状态，telemetry 承载电池和固件版本，wake payload 为纯 `{"type":"wake"}`，Overview 使用 QoS 1 retained；通知正文、TTS、ACK 和播放完成态仍走 WebSocket。
    impact: 如果把语音或通知业务内容混入 MQTT，或让服务端、OTA、ACL、固件使用不同 topic/派生规则，设备状态、遥测、离线唤醒、Overview 和真实提醒投递会再次分裂。
    mitigation:
      - MQTT 只承担设备状态、telemetry、wake 和 Overview；业务通知、课程提醒、待办提醒正文继续走 WebSocket 投递与 ACK 链路。
      - 保证 `device_id` 全局唯一，并用 Mosquitto ACL 限制设备只能发布自己的 status/telemetry、订阅自己的 notification/overview。
      - 固件从服务端下发的 status topic 派生同设备 telemetry topic；服务端、ACL 和测试必须共同约束该规则。
      - 增加测试断言 status、telemetry、wake、Overview topic、payload、OTA 字段和 ACL 与固件合同一致。
      - 未来出现多个独立组织共用部署和 Broker 时，必须重新完成需求与迁移设计评审，不能从当前历史字段自动推导主题迁移任务。
    related_items:
      - XIAOXIN-002
      - XIAOXIN-006
      - XIAOXIN-013
      - XIAOXIN-015

  - id: RISK-006
    title: 仓库跟踪配置中的 API 密钥与部署凭据
    severity: high
    summary: 当前被 Git 跟踪的示例和本地配置中存在多项非占位符形式的 API key；无论这些值当前是否有效，都不应继续作为可复制的仓库默认配置传播。
    impact: 有效凭据可能被未授权使用、产生费用或导致服务配置被滥用；失效凭据也会让新部署误以为仓库内配置可以直接用于生产。
    mitigation:
      - 立即核对并轮换仓库历史中出现过的非占位符凭据，不在需求账本中复制具体值。
      - Git 跟踪的 `config.yaml` 和 `data/.config.yaml` 只保留明确占位符；真实值放入未跟踪的部署私有配置、环境变量或密钥管理系统。
      - 增加提交前敏感值扫描，并让 CI 拒绝明显的真实 API key、token、password 或 secret。
      - 部署文档明确区分示例配置、开发配置和生产密钥注入方式。
    related_items:
      - XIAOXIN-013
      - XIAOXIN-015
      - XIAOXIN-016

  - id: RISK-007
    title: 虚假成长、记忆越界与监控感
    severity: high
    summary: 如果小芯年龄、关系阶段或陪伴章节被错误地从相处时间、聊天次数或模型自由总结推导，小芯会虚构共同经历、误用短期情绪并制造被长期监控的感觉。
    impact: 用户一旦发现小芯“记错、装熟、强行成长总结”，陪伴产品的可信度会比普通功能失败更快崩溃。
    mitigation:
      - 小芯年龄、真实相处时长和关系阶段采用独立事实源，主题只作为 Evidence 的可选索引。
      - 只有带来源、时间、状态且允许使用的证据才能进入成长回望和主动关心。
      - 普通回复限制旧记忆引用数量；用户拒绝、纠正或遗忘后立即停止相关使用。
      - 所有成长功能必须覆盖虚构经历、错误记忆、定向遗忘和拒绝继续话题测试。
    related_items:
      - XIAOXIN-018
      - XIAOXIN-019
      - XIAOXIN-PROD-020
      - XIAOXIN-PROD-021
      - XIAOXIN-PROD-022

  - id: RISK-008
    title: 关系阶段被互动次数和活跃度绑架
    severity: high
    summary: 当前关系等级主要使用有意义互动、成长事件和活跃弧线计数；如果直接作为正式成熟度，短时间高频聊天可能快速进入高关系阶段，长期安静用户反而被判定为关系浅。
    impact: 小芯会过早装熟、诱导互动，并把产品优化方向错误地变成提高聊天次数。
    mitigation:
      - 关系阶段同时要求跨日期互动、可靠 Evidence、有效跟进和低纠错率等质量门槛。
      - 互动次数只作为证据之一，不能单独触发高阶段。
      - 用户偏好安静或低频使用时，不因活跃度低降低基础服务质量。
      - 建立刷对话、长期静默、错误记忆和重新活跃场景测试。
    related_items:
      - XIAOXIN-018
      - XIAOXIN-PROD-020

decisions:
  - id: DEC-001
    title: 工作台主入口放在服务端仓库
    date: 2026-07-04
    decision: "`docs/requirements/` 位于 `xiaoxin-esp32-server`。"
    rationale: Xiaoxin 的产品总账跨服务端和固件，服务端仓库更适合作为控制台、身份、记忆和投递链路的总入口。
    tradeoffs:
      - 固件仓库已有功能地图不会被废弃，但第一版不再作为主入口。
      - 跨仓库证据路径会使用绝对路径记录。
    related_items:
      - XIAOXIN-014
  - id: DEC-002
    title: 第一版只维护一个总工作台
    date: 2026-07-04
    decision: 不拆分服务端工作台和固件工作台。
    rationale: 两份工作台会导致状态漂移，第一版更需要统一产品边界。
    tradeoffs:
      - 单个 YAML 会更长，但可通过模块和筛选控制复杂度。
    related_items:
      - XIAOXIN-014
  - id: DEC-003
    title: 身份系统独立于 8002 manager-api
    date: 2026-07-04
    decision: Xiaoxin 控制台第一阶段使用 8003 独立账号和 SQLite 身份中心。
    rationale: 记忆隔离依赖账号、设备、speaker 的产品语义，不适合直接复用上游管理后台用户体系。
    tradeoffs:
      - 需要维护额外登录/session 逻辑。
      - 后续如需统一账号，可再设计迁移或桥接。
    related_items:
      - XIAOXIN-004
      - XIAOXIN-005
  - id: DEC-004
    title: 首发设备 MQTT 以服务端配置和 device-scoped topic 为事实源
    date: 2026-07-08
    decision: 当前单组织部署使用 `device/{device_id}/status`、`device/{device_id}/telemetry`、`device/{device_id}/notification` 和 `device/{device_id}/overview`。endpoint、设备 credential、基础 topic、ACL 和 wake 授权由服务端配置、OTA 响应、凭据库和 owner 绑定关系统一生成；固件从 status topic 派生 telemetry topic，wake payload 为纯 `{"type":"wake"}`。
    rationale: 商用固件不能依赖硬编码公网 broker；学生操作必须绑定到登录账号和其拥有的设备。设备遥测需要在 WebSocket 断开时仍可更新，但业务通知正文和 TTS 仍必须保留在可追踪 ACK 的 WebSocket 链路。当前没有多组织共享部署需求，因此租户命名空间不是协议前置条件。
    tradeoffs:
      - 需要维护额外的 device credential 数据库和 Mosquitto auth 导出流程。
      - 未来若出现多组织共享部署需求，需要重新评审数据、凭据、ACL 和 topic 迁移；不能从当前历史字段直接推导实施任务。
    related_items:
      - XIAOXIN-002
      - XIAOXIN-006
      - XIAOXIN-013
      - XIAOXIN-016
  - id: DEC-005
    title: 小芯年龄、相处时长与关系阶段采用三条独立轴线
    date: 2026-07-15
    decision: 小芯年龄只由学生资料当前年级映射；真实相处时长来自首次实际绑定或互动；关系阶段来自当前 relationship epoch 的可靠互动和反馈。三条轴线互不推导，主题只作为通用 Evidence 的可选索引。
    rationale: 大二首次使用、换设备、休学、延毕和低频使用等场景证明单一年龄或等级无法同时表达真实时间、关系和个人变化。
    tradeoffs:
      - 状态模型和跨端投影更复杂，需要明确各自事实源和切换规则。
      - 产品文案可以继续使用“1 岁小芯”，但实现和验收必须使用精确领域概念。
    related_items:
      - XIAOXIN-020
      - XIAOXIN-PROD-019
      - XIAOXIN-PROD-020
  - id: DEC-006
    title: 小芯成长改变相处校准而不是基础能力
    date: 2026-07-15
    decision: 版本化 CompanionPolicy 根据明确边界、小芯年龄形态、关系阶段、active adjustment 和短期状态改变提问、记忆使用、主动程度、表达和回望方式，但不锁定或降低基础能力。
    rationale: 人工限制 1 年小芯的基础能力会损害首日体验，也会把成长退化成传统等级系统；真正差异应来自更可靠的了解和更合适的行为。
    tradeoffs:
      - 行为差异比功能解锁更难测试，需要结构化 CompanionPolicy 和对照场景。
      - 高关系阶段仍必须在证据不足时保持保守，不能为了明显差异而增加虚构或黏人表达。
    related_items:
      - XIAOXIN-018
      - XIAOXIN-PROD-020
  - id: DEC-007
    title: 个人宠物生命周期归微信主体所有并独立于设备和记忆主体
    date: 2026-07-15
    decision: 在现有 `xiaoxin_control.db` 中使用独立 `personal_pets` 记录承载稳定 pet_id、生命周期状态和 companion_started_at。归属链路是 `openid -> 本地 users.id（微信主体）-> personal_pet`；设备是可替换入口，`memory_subject_id` 只负责说话人隔离。陪伴起点只用于真实相处时长，不承担小芯年龄或关系阶段事实源职责。
    rationale: 当前陪伴天数直接读取设备 bound_at，而解绑会清空 bound_at；memory_subject 又同时包含设备和 speaker，二者都会导致 personal pet 归属或真实相处起点随入口变化。openid 是目前唯一可获得的稳定微信标识，现有代码会将它映射为内部 users.id；但微信主体建立可能早于真正开始陪伴，因此还需要独立 companion_started_at。
    tradeoffs:
      - 需要新增表、迁移现有陪伴天数并维护微信主体、个人宠物、设备和记忆主体之间的投影关系。
      - 独立表比直接复用 student_profiles.created_at 更复杂，但避免 openid 首次会话时间被误认为陪伴起点，也为归档、主体合并和未来多宠物策略保留边界。
      - 未来如接入学校认证，只能把认证身份关联到现有微信主体，不能自动重建或覆盖个人宠物。
      - openid 只在同一小程序 appid 下稳定；更换 appid 时需要显式迁移或额外身份关联，不能自动认回。
      - 未知说话人只能进行无私人长期记忆的会话级交互，不能推动关系阶段或自我调整。
    related_items:
      - XIAOXIN-005
      - XIAOXIN-020
      - XIAOXIN-PROD-004
      - XIAOXIN-PROD-019
  - id: DEC-008
    title: 自然画像由语义理解驱动且模型不得绕过确定性写入门禁
    date: 2026-07-21
    decision: 自然对话中的用户画像和长期记忆由多轮 MemoryInterpreter 提议，主对话模型通过内部 recall_companion_memory 规划自然召回；正则只保留用户控制、直接关系强反馈、安全验证和失败关闭。模型永不直接写 Store，最终 drop、candidate 或 active 由 CompanionMind 的确定性 MemoryWritePolicy 决定。
    rationale: 陪伴伙伴不能要求用户使用“我喜欢”“我来自”等固定句式，也不能只靠关键词理解自然回忆；但让模型无条件直写会把短期情绪、转述、玩笑和错误归因永久化。语义理解与确定性持久化分工可以同时提高自然覆盖和可信度。
    tradeoffs:
      - 需要短期保存受限多轮上下文并增加异步模型成本、shadow 评估、候选确认和更严格的隐私清理。
      - semantic 模块故障时自然画像失败关闭，不再由正则偷偷补写，短期内会牺牲部分采集率以避免不可见的错误记忆。
      - active_explicit 必须等待 CP-06 纠错入口和 CP-07 真实数据门槛，不能因代码完成直接生产开启。
    related_items:
      - XIAOXIN-003
      - XIAOXIN-019
      - XIAOXIN-PROD-021
      - XIAOXIN-PROD-023
  - id: DEC-009
    title: 需求工作台改为一体化主线优先
    date: 2026-08-03
    decision: requirements 工作台保留小程序、硬件、陪伴成长和陪伴产品化分栏作为明细，但新增 integrated_companion_requirements 作为第一屏权威总览；后续优先按“大一新生陪伴型电子宠物”的一体化体验推进，而不是按模块孤立扩张。
    rationale: 当前项目最大风险已经不是缺少单点功能，而是服务端记忆、小程序控制、硬件表现、模型提示词和验收脚本各自推进后，用户仍感受不到“这是我养出来的小芯”。一体化主线能把工程事实约束到可感知陪伴结果。
    tradeoffs:
      - YAML 会更长，但第一屏能直接看到主线、状态和下一步，不需要在四个分栏之间来回拼接判断。
      - 原分栏仍保留，避免丢失历史证据、细项验收和跨仓库追踪。
    related_items:
      - XIAOXIN-014
      - XIAOXIN-PROD-001
      - XIAOXIN-PROD-023
