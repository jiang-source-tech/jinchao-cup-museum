integrated_companion_requirements:
  title: 项目一体化主线
  summary: >
    小芯当前的产品定义应统一为“面向大一新生的陪伴型电子宠物”，不是通用聊天硬件，也不是单纯学院吉祥物展示页。
    所有模块都必须服务同一条主线：一个学生绑定一个稳定个人小芯；同一个小芯拥有长期记忆、可解释关系成长、可感知个体性格和低负担情绪陪伴；
    服务端、小程序和硬件只是在不同入口消费同一套事实源与体验合同。
  current_state:
    - 本工作台在 2026-08-03 升级到 version 0.17.0，CP-08 双向关系需要与连接主动已完成 Slice A 至 E 工程闭环；原小程序、硬件、陪伴成长和陪伴产品化分栏保留为可追溯明细。
    - 当前 CP-08 Slice A/B/C/D/E 实现继续使用 CompanionStore schema v21；每次发布都必须重新核对本地、GitHub origin/main 和生产服务器。需求事实不固定记录易过期的提交哈希。
    - 前台主对话配置使用 selected_module.LLM=AliLLM，AliLLM.model_name=qwen3.7-flash；语义记忆仍由 DeepSeek/MemoryInterpreter 一类中间层负责解释与细分，模型不得直接写入 Store。
    - 已使用两台已绑定真实设备完成“文字输入、真机输出链路”的双主体连续陪伴验收；输入走 POST /api/xiaoxin/devices/{device_id}/text-chat，输出仍经过生产 LLM、WebSocket、TTS 和真实设备。
    - A/B 两个主体已经能在相似场景下自然召回不同长期主线：A 偏嵌入式课程设计、驱动调试和初始化失败，B 偏数字钢琴考级、模拟上台紧张和弹乱。
    - 当前体验已经越过“能否记住”阶段，主要风险转为：记忆召回是否自然、人格差异是否稳定、低落场景是否少追问、主动陪伴是否不过界、硬件表达是否能把差异表现出来。
    - 真实 7 天或 12 人用户研究不作为当前工期门槛；现阶段用双设备、压缩多日期、多场景连续对话和人工听感记录替代，用于发现明显的长期陪伴问题。
    - CP-08 Slice A/B/C/D/E 已落地 schema v21 关系需要、connection_bid 到期生成、deferred 恢复、Prompt v3 人格化表达和反馈塑形：30 分钟窗口内回应会重置连接需要，忽略按气质与连续次数退避，明确拒绝进入 7 天冷却，系统投递失败不计为用户忽略。
  recommendation: >
    后续所有开发优先围绕“一体化陪伴闭环”推进：先用同一个接口链路下的两台真实设备验收 CP-08 反馈塑形，证明不同关系需要、主动表达与回应后变化真实成立；再补小程序低负担控制与回看，
    最后把硬件表情、主动陪伴、异常恢复和运营观测接成发布门禁。不要再把服务端记忆、小程序页面、硬件 UI 和评测脚本当成互相独立的模块。
  priority_order:
    - INT-00 产品定位与成功标准
    - INT-01 身份、设备与个人小芯归属
    - INT-02 对话主链路与真机输出
    - INT-03 长期记忆、人格与情绪陪伴
    - INT-04 小程序低负担消费与控制
    - INT-05 硬件表达、状态与运行健康
    - INT-06 发布、部署与生产观测
    - INT-07 压缩纵向验收与证据闭环
  columns:
    - id: INT-00
      title: 产品定位与成功标准
      priority: P0
      status: active
      focus: 把所有模块统一到“大一新生陪伴型电子宠物”目标，避免继续按聊天机器人、课程工具、硬件玩具或学院吉祥物四条线分裂推进。
      implemented:
        - 已明确小芯核心价值是情绪陪伴、长期记忆和不同 pet 的可感知个体差异。
        - 已确认当前成熟度不能只看功能数量，应看用户是否觉得“这是我养出来的小芯，而不是同一个模型换了名字”。
        - requirements 工作台新增一体化主线，作为所有模块优先级的上层索引。
      requirements:
        - 每个新增需求必须能回答它如何增强陪伴感、记忆感、个体差异、真实设备体验或生产可控性。
        - 对用户不可见的工程能力必须落到对话、主动关心、硬件表现、小程序控制或运营验收中的至少一个可观察结果。
        - 第一版不追求社交游戏化、金币装扮或复杂养成系统；差异主要来自 pet_id、Evidence、关系阶段、相处调整、VA 和表达策略。
      remaining:
        - 写一份更短的产品验收口径：什么叫“像自己的小芯”、什么叫“记错/装熟/过界”、什么情况下必须停止扩大测试。
        - 将 README、宣传文案和首次引导从“学院吉祥物”统一改为“大一新生陪伴型电子宠物”。
      acceptance:
        - 任意模块评审时都能追溯到一体化主线中的一个 INT 条目。
        - 用户不理解内部模块名，也能从连续使用中感到小芯在记忆、语气、主动程度和陪伴方式上逐渐贴近自己。
      related_items:
        - XIAOXIN-PROD-001
        - XIAOXIN-014
        - XIAOXIN-PROD-023
    - id: INT-01
      title: 身份、设备与个人小芯归属
      priority: P0
      status: partial
      focus: 用微信主体、confirmed speaker、memory_subject_id、pet_id 和设备绑定形成稳定归属，确保两台设备代表两个用户时不会互串记忆或人格。
      implemented:
        - 已有微信 openid、本地微信主体、设备绑定、speaker profile、memory subject 和 personal pet 生命周期事实源。
        - 双设备测试使用各自已绑定主体，不交换 speaker profile，不按 COM 端口推断身份。
        - 解绑、换设备和个人宠物生命周期已经在 CompanionMind V2 规格中分离。
      requirements:
        - 所有私人记忆读写必须同时满足 owner、pet、memory subject、当前 relationship epoch 和 confirmed speaker 约束。
        - 设备只是访问入口，不能成为长期记忆、个人小芯生命周期或人格差异的事实源。
        - 双设备验收必须记录设备身份、主体、pet_id、输入原文、服务端回复、TTS 终态和串口状态。
      remaining:
        - 补设备重绑、设备离线 wake、speaker 失配、unknown speaker 和账号清空后的完整异常验收。
        - 上线前设计清空历史数据后的首批用户初始化流程。
      acceptance:
        - A 设备永远不能召回 B 的钢琴考级事实，B 设备永远不能召回 A 的嵌入式调试事实。
        - 换设备不换小芯，换账号不继承旧小芯，unknown speaker 不写入私人长期记忆。
      related_items:
        - XIAOXIN-005
        - XIAOXIN-020
        - XIAOXIN-PROD-003
        - XIAOXIN-PROD-004
    - id: INT-02
      title: 对话主链路与真机输出
      priority: P0
      status: partial
      focus: 确保文字输入测试接口真实穿过生产对话、记忆召回、TTS、WebSocket 和设备输出，不把单轮 API 回复误判为设备体验。
      implemented:
        - 双设备验收约定使用 POST /api/xiaoxin/devices/{device_id}/text-chat，设备离线时先 wake，等待实时连接后再提交。
        - 最近验收中两台设备连续 8 轮均达到 tts_state=ready -> done -> speaking -> idle。
        - 低落表达“脑子还是乱的”已经避免机械追问，回复更接近陪伴式承接。
      requirements:
        - 连续陪伴场景默认 4 至 6 轮，必须在上一轮 TTS 结束且设备回到 idle 后提交下一轮。
        - 评测同一场景不能只问一轮就换主题，应保留起点、情绪推进、记忆触发、纠正/偏好变化和收尾。
        - 真机文字输入链路不能声明 ASR 通过；它只绕过麦克风和 ASR，其余生产链路仍必须参与。
      remaining:
        - 补掉线重连、wake 失败、TTS 失败、模型超时、重复提交和设备忙碌时的用户可感知表现。
        - 建立一份固定双设备脚本，覆盖学习压力、社交不适、兴趣偏好、偏好变化、低落不追问和主动陪伴。
      acceptance:
        - 同一场景 4 至 6 轮内，回复能承接上一轮语境，不突然切换成模板问答。
        - 服务端日志、TTS 终态和串口状态能互相对上，不能只凭 HTTP 200 判定通过。
      related_items:
        - XIAOXIN-001
        - XIAOXIN-006
        - XIAOXIN-PROD-007
        - XIAOXIN-PROD-009
    - id: INT-03
      title: 长期记忆、人格与情绪陪伴
      priority: P0
      status: active
      focus: 把 MemoryInterpreter 粗分类/细分类、CompanionMind 确定性写入、召回规划、人格气质和 VA 情绪状态合成一个可解释陪伴伙伴。
      implemented:
        - 长期记忆已经从窄正则主路径升级为语义解释、确定性分级写入和自然召回工具链。
        - 已形成粗分类到细分类的记忆模型方向：画像、偏好、边界、生活事件、关系上下文、目标、短期状态等由语义层提议，Store 层决定 drop/candidate/active。
        - qwen3.7-flash 前台回复经自然化改造后，主线召回不再机械表达“我记得三点/两点”。
      requirements:
        - 模型可以自由表达，但必须遵守记忆纪律：不用内部列表口吻，不强行展示证据数量，不在低落场景频繁追问，不把候选或旧 epoch 当事实。
        - 偏好变化不要求用户说“这是变化，请记住”；DeepSeek/MemoryInterpreter 应能从自然表达判断稳定偏好、短期情绪和修正意图，但最终写入仍走确定性门禁。
        - 个体差异必须是稳定、可解释和可撤销的，不能靠随机 prompt 风格漂移冒充人格。
      remaining:
        - 针对两台设备各跑一组压缩多日期连续陪伴脚本，观察同一场景下是否出现稳定不同的说话节奏、关注点和安慰方式。
        - 将明显机械、过度追问、错误装熟和记忆展示欲纳入自动或半自动评分。
        - 按 CP-08 实现 connection_bid，让用户回应或忽略能够确定性影响各自小芯后续的主动节奏，而不是只改变一句文案。
      acceptance:
        - A/B 两个 pet 在事实不同但场景相同的情况下，能体现不同记忆关注和陪伴方式，而不是只替换关键词。
        - 用户表达偏好变化、边界变化或状态变化时，小芯能先承接当下，再逐步形成可确认记忆，不要求用户使用固定咒语。
      related_items:
        - XIAOXIN-003
        - XIAOXIN-017
        - XIAOXIN-018
        - XIAOXIN-019
        - XIAOXIN-PROD-020
        - XIAOXIN-PROD-021
        - XIAOXIN-PROD-023
    - id: INT-04
      title: 小程序低负担消费与控制
      priority: P1
      status: partial
      focus: 小程序不做工程诊断台，主要承担绑定、资料、课程提醒、低存在感记忆确认、纠错、删除和主动陪伴开关。
      implemented:
        - 小程序已有首页、课表、提醒、通知历史、校园导航、个人设置和部分成长摘要消费基础。
        - 服务端已提供 miniprogram 安全候选投影与 confirm/reject/correct/delete 合同。
        - 小程序设置页已有低存在感“陪伴方式”入口；陪伴页首屏已接通主动陪伴开关、少一点/自然一点频率和过往引用边界，复杂相处与记忆控制默认折叠到二级区域。
        - 服务端 miniprogram 投影只返回关闭/安静/自然、过往不提/偶尔/自然联系等用户可理解状态；不下发内部策略档位、Evidence、关系指标或原因码。
      requirements:
        - 学生侧默认不展示 Evidence 计数、内部关系指标、原始 VA、出生种子或模型原因码。
        - 记忆确认和纠错应放在二级入口或自然对话反馈里，不能让用户像审核员一样频繁处理候选。
        - 主动陪伴必须有可理解开关、静默时段和“太主动/太私人/没帮到我”反馈入口。
      remaining:
        - 补按用户生效的主动陪伴安静时段，以及主动消息上下文中的“太主动/太私人/没帮到我”轻量反馈。
        - 继续接通候选确认、纠错、删除的二级记忆入口，避免日常页面变成候选审核台。
        - 补小程序聊天记录与设备真实输出记录的关联查询。
      acceptance:
        - 用户能纠正或删除错误记忆，但日常使用不会被候选审核打断。
        - 小程序展示的成长摘要与设备对话表达不冲突。
      related_items:
