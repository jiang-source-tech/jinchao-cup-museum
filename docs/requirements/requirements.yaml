        - XIAOXIN-017
        - XIAOXIN-003
    - id: CP-01
      title: Observation 统一采集与可信 Evidence
      priority: P0
      status: done
      focus: 用统一 Observation 接收语音显式事实、待办、提醒、用户反馈和系统结果，使关系成长与主动陪伴拥有真实生产输入。
      implemented:
        - CompanionMind 外部 interface 已增加 observe(CompanionObservation)，Observation 合同包含幂等键、已确认主体、事件类型、来源、发生时间、结构化 payload 和安全摘要。
        - Schema v7 已包含 companion_observations、observation_evidence 血缘、pending_companion_observations 待处理队列、Evidence fact_key、importance、sensitivity、valid_from/valid_until 及索引；v7 为待处理队列增加 attempt_count、last_error_code、expires_at，并具备 v6→v7 在线迁移测试。
        - 相同幂等键与相同内容返回 duplicate；相同键不同内容拒绝。相同 fact_key 的新 Evidence 会 supersede 旧 Evidence 并保留不可变 relation。
        - unknown speaker 零私人 Observation 写入，跨 owner 写入抛 PermissionError；无 personal pet 时 Adapter 失败关闭，无唯一 confirmed memory subject 时只写 owner/pet 级待处理事件，不绑定 device_unknown 或任意说话人。
        - 小程序待办 create/update/explicit complete/delete 与语音提醒创建已接入 Observation；设备可靠 TTS 完成分别记录 reminder_delivered 和 reminder_tts_completed。
        - 待办 status 与 reminder_status 已拆分：dispatch、missed、TTS completed 不再把用户待办误标为 done，只有显式用户操作生成 followup_completed Evidence。
        - operator Projection 和控制台已提供 subject-scoped Observation 时间线、Observation-Evidence 血缘、待处理明细、状态健康指标和结构化 Evidence 元数据；明细只显示安全摘要、来源、状态、尝试次数、错误类型和过期时间，不暴露 payload 原文。
