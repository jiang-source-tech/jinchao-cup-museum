companion_productization_requirements:
  title: 陪伴记忆产品化改进（P0）
  summary: >
    当前 CompanionMind 已具备可信 Evidence、关系时期、确定性策略、异步整理、结构化相关性召回、真实关系质量输入、主动陪伴调度、用户控制和多端投影合同，
    CP-SEM 工程改造已经消除“只靠窄正则、只看当前一句、只靠关键词召回”的主路径；当前默认关闭语义发布开关，下一约束是用真实 shadow/candidate 数据证明准确率，而不是继续堆接口。
    本板块是当前最高优先级工作，目标是把服务端合同转化为用户能持续感知的“记得准、想得起、会成长、能主动且不过界”的陪伴闭环。
  current_state:
    - CP-01 已完成统一 Observation 采集切片：课程 CRUD、普通提醒终态失败、主动陪伴反馈、明确目标、普通未来事件、陪伴边界、用户直接反馈和 Evidence 纠正均具备审计与血缘；无唯一 confirmed subject 时安全待处理并在主体唯一后回填。自然生活事件的候选提取明确归 CP-02，不再混入 CP-01。
    - CP-02 已完成服务端候选记忆闭环：已确认自然对话只短存当前用户一句，后台模型必须逐字引用原文片段，所有提取默认 candidate-only；确认、拒绝、冲突替代、重试和来源清理均走统一 Store 事务。生产开关仍保持关闭，真实 candidate-only 评估归 CP-07。
    - CP-03 已完成结构化相关性召回：CompanionTurnRequest 接收仅用于当前轮的 retrieval_query/retrieval_hints，Store 使用 fact key、SQLite FTS5 trigram 和确定性重排选择 Evidence；召回审计不保存查询原文，只短期保存 SHA-256 摘要。已确认 conversation 仍可按 CP-02 规则把同一句话作为 turn source 最多短存 24 小时，不由召回审计重复复制。
    - CP-04 已完成 CompanionPolicy v2 关系质量闭环：continuity 来自当前 epoch 的跨日已提交回合，knowledge 来自高置信当前 Evidence，helpfulness 来自明确 accepted help/完成 followup，attunement 只接受正向直接反馈；待办完成、小程序反馈、语音强表达和 initiative 用户结果均已接入，负反馈不会反向奖励阶段。
    - CP-05 已完成主动陪伴生产调度闭环：Evidence/Observation 原子生成 opportunity，异步 run_due_work 并行处理 reflection 与 initiative，资格检查和原子 claim 后才调用严格模型 Composer，并通过注入的 InitiativeDeliveryPort 复用现有 dispatcher；Delivery Outcome 与 User Outcome 分开持久化。2026-08-03 已部署 bd5922a，离线设备可进入 dispatcher MQTT 唤醒，短期跟进窗口为 240 分钟。
    - 2026-07-21 改造前审计曾确认：turn_analysis.py 是 profile/preference/life event 语音采集主路径、候选只读当前一句、召回依赖少量关键词；这些缺口现已由 CP-SEM 阶段 1–8 的工程实现修复。
    - 新增 CP-SEM 作为 CP-06 的 P0 前置：自然对话画像改由多轮 MemoryInterpreter 驱动，长期召回改由 MemoryRecallPlanner 和内部 recall_companion_memory 工具驱动；正则只保留控制、安全验证和失败关闭，不再承担画像理解。
    - CP-SEM 阶段 0 的历史全量基线为 1227 passed；阶段 0–8 的工程实现现已完成：schema v12 多轮上下文、生产 MemoryInterpreter、确定性分级写入、正则画像退役、主 LLM 单工具自然召回、无原文评估、miniprogram 安全候选投影和渐进发布/回滚门禁已经接入；代码默认 mode 仍为 off，当前受控部署 override 已开启 candidate，真实 500 条人工复核门槛和 active_explicit 放行仍属于部署验收，不能用自动化结果替代。
    - CP-00 已把控制运行时创建的进程级 CompanionMind 注入所有语音连接；控制运行时缺失时进入无私人持久记忆模式，不再静默创建第二个持久化实例。
    - 代码默认 companion_worker_enabled=false；当前受控部署 override 已开启 worker、candidate 语义解释、initiative scheduler 和真实 delivery，未经确认的 candidate 仍禁止进入 prompt，active_explicit release gate 继续关闭。
    - CP-05 历史基线为 Xiaoxin 全量 1183 passed、schema v11；CP-08 Slice A/B/C/D/E 已在 schema v21 上完成关系需要、顺延、人格化表达和反馈闭环。代码默认配置继续失败关闭；当前受控部署显式开启 candidate、后台 worker、initiative scheduler 和真实 delivery，必须持续审核语义评估、队列、投递频率和用户反馈。
    - 2026-08-03 当前前台主对话配置为 AliLLM/qwen3.7-flash；最近主线已完成长期记忆分类、主线偏好优先级、失败兜底和自然化召回表达，目标是保留模型自由度但压住机械列点、过度追问和错误装熟。
    - 2026-08-03 已完成双设备/两台真实设备的文字输入、真机输出链路复测；A/B 主体在相同陪伴场景下能召回不同长期主线，TTS 状态链路稳定，低落场景已经避免立即追问。
    - 真实 7 天或 12 人用户研究不作为当前工期门槛；当前 CP-07 先用两台真实设备、模拟日期和连续 4 至 6 轮场景脚本做压缩纵向验收，未来真实上线前清空测试数据。
    - CP-08 Slice A/B/C/D/E 已完成工程实现：schema v21 新增关系需要状态和 deferred 机会，scheduler 到期后只物化一次有 Evidence 的 connection_bid；Prompt v3 接收白名单 initiative_bias、relationship_stage 和 connection_need_strength；反馈窗口、回应重置、性格化忽略退避、连续忽略增长和拒绝冷却均已接入同一 Store 状态机。
  recommendation: >
    CP-00 到 CP-05 和 CP-SEM 的工程基础已经完成，当前受控部署已经开启 candidate 语义解释、后台 worker 和主动投递。
    下一步优先部署 CP-08 Slice E，并用两台真实设备做 2 至 5 分钟缩时验收：证明两个小芯会以不同节奏和表达寻求连接，且一台回应、一台忽略后各自状态按预期变化，再继续 CP-06 低存在感确认/纠错页面。
    不新增第二套 MemoryEngine，不恢复旧 JSON/JSONL，不双写事实源，也不先用向量数据库掩盖采集与归属问题。
  priority_order:
    - CP-00 统一 CompanionMind 装配与产品化基线
    - CP-01 Observation 统一采集与可信 Evidence
    - CP-02 异步候选记忆提取与确认
    - CP-03 结构化、FTS 与相关性召回
    - CP-04 真实关系信号与关系质量策略
    - CP-05 主动陪伴机会、调度与反馈闭环
    - CP-08 双向关系需要与连接主动
    - CP-SEM 语义记忆采集、分级写入与自然召回
    - CP-06 小程序、控制台与硬件消费
    - CP-07 真机、真实用户校准与发布门禁
  columns:
    - id: CP-00
      title: 统一 CompanionMind 装配与产品化基线
      priority: P0
      status: done
      focus: 消除语音连接与控制运行时各自构造 CompanionMind 的双实例结构，建立唯一进程级装配、观测基线和安全回滚点。
      implemented:
        - ConnectionHandler 复用 create_xiaoxin_control_runtime() 创建的进程级 CompanionMind，并把同一对象注入每条 XiaoxinRuntime 语音连接。
