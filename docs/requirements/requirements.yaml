    - id: CG-IND-01
      title: 个体人格与长期成长 V1
      priority: P0
      status: partial
      focus: 在同一个小芯核心身份和现有 CompanionMind 内，以终身稳定的五轴出生气质、有 Evidence 且可撤销的相处调整、四学年成熟表达、长期关系节奏和短期 VA，形成稳定、可解释、可控制并能被纵向验证的个体差异。
      implemented:
        - 现有 CompanionMind 已提供统一六操作、SQLite Evidence/epoch/Adjustment/Chapter/GrowthMoment、确定性 CompanionPolicy v3、主动陪伴和多端投影基础，本条只扩展该基线，不创建第二套人格引擎。
        - Slice 1 至 Slice 12 已完成生产实现：七类确定性人格探针、五轴出生气质与 legacy backfill、结构化 expression_style、气质显露、Evidence 驱动的一档相处调整、反向重算、长期关系阶段与短期关系姿态、四学年成熟表达、非标准学业路径、周年/毕业/成长时刻、跨重启 VA，以及小程序、语音和硬件受限投影与控制合同均接入现有 CompanionMind。
        - CompanionStore 已升级到 schema v19；出生气质、迁移审计、Adjustment、关系、叙事与 VA 继续使用同一 SQLite 事实源，并具备迁移备份、完整性、外键、并发和确定性重放验证。
        - Slice 13 已实现 243 组合矩阵、七类场景/控制交互、匹配反事实、D7/D30/D90 预注册研究报告器和真实 ESP32 HIL 证据门禁；2026-08-03 已使用两台已绑定真实设备完成文字输入、真机输出链路的双主体连续陪伴验收，完整 HIL 门禁仍需补足异常路径、OTA、长稳和证据齐套。
        - Slice 14 已实现同一 Git SHA 下不可跳级的受控发布评估 CLI、P0 立即停止、版本/数据库/备份/矩阵证据绑定，以及 HIL、D7、D30、D90 和旧行为清理的独立放行门禁；纵向检查点同时约束样本、成长、记忆、控制、烦扰和监控感，工具只签发 PASS/FAIL/INCONCLUSIVE 审计报告，不自动修改生产开关或删除旧路径。
      requirements:
        - 出生气质必须按 `pet_id` 一次稳定生成并持久化，使用探索取向、表达活力、思路组织、玩心倾向和陪伴主动性五个独立三档语义枚举；全部 243 种组合合法，禁止统一保存为 low/medium/high、自由文本人格或可重抽类型。
        - 出生气质终身不变；后天成长只能由当前 relationship epoch 内合格 Evidence 形成具体行为与场景的一档相处调整，并支持 candidate/trial/active、反向学习、纠正、撤销、过期和遗忘后重算。
        - "`CompanionPolicy` 必须确定性投影结构化 `expression_style`；气质、年龄、关系阶段、当前关系姿态、VA、互动契约、场景和端侧限制逐维求交，任何个体化都不得放宽事实、安全、记忆、主动、问题预算或用户边界。"
        - 大一到大四只改变成熟表达，不改变知识和工具能力；非标准学业路径、周年、毕业、章节和一次性成长时刻必须来自权威 revision 与合格 Evidence，不补写缺失学年或虚构共同经历。
        - 关系阶段在同一 epoch 内单调，晋级至少受 14/90/365 天候选跨度、跨日/周/月分布、可靠知识、已确认帮助、正向磨合和近期窗口共同约束；重逢与修复使用独立短期姿态，不扣历史阶段。
        - VA 使用独立的短期 Valence-Arousal 状态、温暖中性基线、版本化动力学、事件幂等和跨重启衰减；VA 不能成为第六气质轴、用户情绪画像、关系分数、主动机会或成长事实源。
        - 用户体验采用主页面安全概览、对话内自然纠正和二级相处与记忆控制页；学生侧不得展示出生种子、五轴档位、Evidence 计数、内部关系指标或原始 VA，硬件只表现受限结果。
        - 生产实现和发布必须分别遵守 `docs/superpowers/specs/2026-07-25-xiaoxin-individuality-growth-v1-design.md` 与 `docs/superpowers/plans/2026-07-25-xiaoxin-individuality-growth-v1-implementation.md`，不得重新创建 CompanionMind 或把隔离原型接入运行时。
      remaining:
        - 在现有两台已绑定真实设备上补足双主体/双设备隔离、每条关键路径 30 次、OTA 成功与回滚、异常掉线/重连、设备重绑和串口日志齐套的完整真实 ESP32 HIL；双设备文字链路通过不能替代该门禁。
        - 完成至少一次 24 小时真机长稳并先冻结真实设备 SLO；归档串口、服务端、网络、策略版本、设备身份和可恢复数据库备份证据。
        - 按固定顺序执行 Slice 14 各阶段的有限队列发布与观察，任何主体串用、虚假事实、边界绕过、重复推进、迁移不可恢复或 HIL 失败立即停止扩大。
        - 完成 12 人 D7 校准、D30 对照研究和至少 60 名有效完成者的 D90 确认；在辨识、成长、记忆正确性、烦扰、失访和主体隔离全部达标前，不宣称“越养越懂你”。
        - 仅在 D90、HIL、发布观察、回滚窗口和备份恢复全部 PASS 后，另行提交旧 policy 分支、宽松 Adjustment 路径、临时 shadow 字段和过期 feature flags 的清理；出生气质与迁移审计永久保留。
      acceptance:
        - 同一 pet 跨设备和重启保持同一出生气质与确定性策略；不同 pet 在事实、能力和安全相同条件下能产生可解释且非随机的行为差异。
        - 合格相处调整在三个不同上海日期后才影响表达，最多偏移一档；用户纠正、撤销、遗忘、重新磨合和清空个人记忆按保留矩阵生效且旧状态不复活。
        - 三日刷量不能推进长期关系；大二首次使用、跳级、休学、延毕、回退、毕业和账号迁移不虚构年龄、章节或共同经历。
        - VA、气质、年龄和关系均不能绕过主动陪伴、负反馈、静默、设备和安全门禁，unknown speaker 与跨 owner/pet/epoch 私人读写为零。
        - 真实 ESP32 关键路径、24 小时长稳和 D7/D30/D90 纵向研究达到权威验证方案门槛；虚假事实、跨主体引用、已删除内容复活和重复成长表达均为零。
