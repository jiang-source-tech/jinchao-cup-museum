        - 同一进程内所有语音连接、控制入口和 worker 使用同一 CompanionMind 实例。
        - 多连接并发不产生重复 Store、不同配置或不可处理 job。
        - tests/xiaoxin 全量通过，现有设备链路行为不回归。
      related_items:
