        - XIAOXIN-016
    - id: INT-06
      title: 发布、部署与生产观测
      priority: P0
      status: partial
      focus: 将 GitHub、服务器、Docker Compose、健康检查、模型配置、worker 开关和证据台账纳入同一个发布事实链。
      implemented:
        - 已形成部署规范：本地、origin/main、服务器 HEAD 三方一致后，服务器执行 git pull --ff-only origin main 和 docker compose up -d --build。
        - 生产服务已支持 worker、candidate 语义解释、initiative scheduler、delivery 和 active_explicit release gate 的独立开关。
        - 服务器凭据说明已写入本地 AGENTS.md 约束，禁止提交认证信息。
        - 已新增 scripts/xiaoxin_release_readiness.py 和 docs/operations/xiaoxin-release-readiness.md，提供发布前只读检查、清库 dry-run/execute 和双设备 24 小时长稳计划入口。
      requirements:
        - 每次上线必须验证 Compose 状态、业务容器日志、HTTP 健康入口和本次变更的聚焦验收。
        - 模型供应商切换必须进入验收记录，至少覆盖回复自然度、记忆召回、低落承接、工具调用和延迟。
        - 任何 active_explicit、主动 delivery 或大范围设备发布都必须有回滚路径。
      remaining:
        - 将发布前只读检查继续扩展到真实远端刷新、服务器 HEAD、Compose 日志摘要和 HTTP 业务验收结果，当前脚本只负责本地可读状态与计划入口。
        - 建立更清晰的生产仪表盘：当前模型、semantic mode、worker backlog、主动投递、TTS 失败、设备在线和最近验收版本。
        - 把压缩纵向评测输出沉淀为可比较的 release evidence。
      acceptance:
        - 部署后能回答“当前跑的是哪个 commit、哪个模型、哪些开关、哪两台设备验收过、失败点在哪里”。
        - 容器启动成功不能替代业务验收通过。
      related_items:
        - XIAOXIN-013
        - XIAOXIN-014
        - XIAOXIN-015
        - XIAOXIN-016
    - id: INT-07
      title: 压缩纵向验收与证据闭环
      priority: P0
      status: active
      focus: 在工期有限且没有真实 7 天/12 人样本的情况下，用两台真实设备、模拟日期和连续场景脚本快速暴露长期陪伴缺陷。
      implemented:
        - 已明确当前阶段不强制真实等待七天，也不要求 12 名真实用户；未来上线前仍需真实数据校准。
        - 允许清理测试 Evidence，且当前项目未真实投入使用，上线前会清空历史数据。
        - 已接受用未来时间污染进行长期效果测试，只要发布前清空并不把测试证据当真实用户证据。
      requirements:
        - 双设备压缩验收必须保留真实设备输出、真实生产模型、真实 TTS 和真实主体隔离，不能退化成离线 prompt 对比。
        - 每个场景至少 4 至 6 轮，覆盖起点、追问/不追问、记忆召回、偏好变化、边界反馈和自然收尾。
        - 记录要区分“实验用模拟日期/Evidence”和“真实上线用户数据”，上线清库前不能混淆。
      remaining:
        - 建立 A/B 两个主体各自的压缩三日或七日脚本，由我代聊自然日常内容并记录主观陪伴感。
        - 加一个轻量评分表：记忆准确、召回自然、个体差异、低落承接、主动不过界、设备链路稳定。
      acceptance:
        - 即使没有真实 7 天，仍能用压缩脚本发现明显的记忆错配、人格漂移、机械追问和跨主体污染。
        - 后续每次模型或提示词改变，都能复跑同一脚本比较体验，而不是只凭感觉判断变好。
      related_items:
