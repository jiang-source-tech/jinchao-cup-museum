        - CompanionMind.prepare_turn() 已记录不含用户原文和记忆摘要的召回安全指标：turn、pet、memory subject、Evidence ID/数量、关系阶段、策略版本、交互类型和延迟。
        - 现有 commit、worker、operator projection 和 initiative 日志/投影继续提供 Evidence、job、关系与主动陪伴的 ID、状态和计数观测，不新增第二事实源。
        - 多连接共享实例、持久化关闭 fallback 和真实 Evidence 召回安全日志均有自动化回归；2026-07-20 Xiaoxin 全量 1054 passed，requirements 16 passed，compileall 通过。
        - 已使用 SQLite 在线 .backup 创建 data/backups/xiaoxin_companion-20260720-cp00.db；源库与备份 integrity 均为 ok、schema 均为 v4，备份 SHA-256 为 9D6220F6991A156723607DA95266F26BDAA1ECFE79319A3254855410CCBBB0EA。
      requirements:
        - 由 create_xiaoxin_control_runtime() 创建进程级唯一 CompanionMind，并注入每条语音连接的 XiaoxinRuntime。
        - 控制运行时缺失时必须明确进入无私人持久记忆模式，不得静默创建第二个持久化 CompanionMind。
        - 建立 Evidence、job、召回、关系和 initiative 的安全指标，只记录 ID、状态、计数、延迟和安全摘要。
        - 保持一个 SQLite 事实源，不修改提醒、通知、OTA 和基础语音行为。
      remaining:
