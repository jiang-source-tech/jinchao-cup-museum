hardware_requirements:
  title: 硬件端需求分栏
  summary: >
    硬件端是小芯 AI Pet 的主要陪伴入口，负责可见状态、语音播放、触摸反馈、
    通知提醒、总览摘要、低功耗和真机稳定性。硬件需求不能只写 UI 页面，
    必须同时写清 OTA、WebSocket、MQTT、ACK、数据注入、播放完成、离线恢复和实机验收。
  current_state:
    - 已有 firmware 条目覆盖宠物主页、通知中心、Overview、本机设置、低功耗、电池和运行健康。
    - 服务端已具备投递、ACK、课程提醒、普通提醒、通知历史和 Overview 摘要的部分能力。
    - 服务端已具备门铃 MQTT 设备凭据、OTA `doorbell_mqtt` 对象和 Mosquitto 认证文件导出能力。
    - 当前 MQTT 主题合同为 `device/{device_id}/status`、`device/{device_id}/telemetry`、`device/{device_id}/notification` 和 `device/{device_id}/overview`；服务端消费 status/telemetry，发布 wake/overview，并通过精确 ACL 隔离设备。
    - 固件已从 OTA 下发的 status topic 派生同设备 `telemetry` topic，周期发布电池档位、电量百分比和固件版本；服务端在无 WebSocket hello 时也可接收并暴露遥测。
    - 服务端已实现学生课程、待办和高德城市天气的 Overview v1 快照聚合，并在课程/待办写入、绑定、解绑、天气变化和手动重同步时刷新或清空设备快照。
    - 固件端已经实现 OTA 配置解析、NVS 持久化、按 OTA 配置启动门铃 MQTT、A/B OTA、周期检查、健康确认和失败回滚；完整真机发布与长稳证据仍需归档。
    - 2026-07-11 已由用户确认 MQTT retained 接收、城市天气显示、课程/待办硬件刷新、offline reconnect、unbind clear 和无 WebSocket Overview 刷新通过；跨设备隔离仍缺两台真机证据。
    - 2026-07-12 已修复通知 TTS 首句字幕控制帧被旧流控队列丢弃的问题；服务端和固件字幕路径测试通过，但屏幕底部字幕仍需保留可归档的真机画面证据。
  recommendation: >
    硬件端优先级应围绕“真机能稳定表达服务端真实数据”排序：
    先保证连接、绑定、OTA、投递和 ACK，再做通知中心与 Overview 真实数据，
    然后补宠物长期状态、本机设置、低功耗和发布验收。
  priority_order:
    - HW-00 设备连接、OTA 与绑定闭环
    - HW-01 语音播放、播报完成与 ACK
    - HW-02 通知中心与 heads-up 提醒
    - HW-03 Overview 总览页真实数据
    - HW-04 宠物主页与轻量状态
    - HW-05 本机设置、配网与设备信息
    - HW-06 低功耗、电池与运行健康
    - HW-07 真机发布、烧录、OTA 与长稳验收
  columns:
    - id: HW-00
      title: 设备连接、OTA 与绑定闭环
      priority: P0
      status: partial
      focus: 设备从刷入固件、请求 Xiaoxin OTA、拿到 WebSocket 地址、获得激活码、绑定微信主体到稳定连接私有服务端的闭环。
      implemented:
        - 服务端和文档已定义 `/xiaoxin/ota/` 与 `/xiaoxin/v1/` 私有路径。
        - OTA activation 已有服务端会话和绑定码设计，固件端已有激活码展示与本地播报码能力。
        - 控制台和小程序侧均已有设备绑定接口的第一阶段能力。
        - 服务端 OTA 响应已能按已知设备生成版本化 `doorbell_mqtt` 对象，包含 `version`、`enabled`、endpoint、client_id、username、password、status/notification/overview topic、keepalive 和 qos；固件消费、持久化、禁用语义和 topic 合同已有代码与主机测试覆盖。
        - 固件已消费并持久化 OTA `doorbell_mqtt` 配置，重启后复用配置；禁用或无效配置不会回退到硬编码公共 broker。
        - 固件从 OTA 下发的 `status_topic` 派生同设备 `telemetry` topic，并按周期上报电池和固件版本。
      requirements:
        - 固件默认 OTA 地址必须指向 Xiaoxin 私有服务端，不再默认引用上游 `/xiaozhi/ota/`。
        - 设备请求 OTA 后必须拿到设备可访问的 WebSocket 地址、版本信息和未绑定时的激活信息。
        - 商用固件必须消费服务端 OTA 下发的 `doorbell_mqtt` 配置，缺失或 disabled 时不得退回硬编码公网 broker。
        - 绑定使用稳定 `device_id`，绑定后小程序和控制台看到的是同一台设备。
        - 真机必须能通过 OTA 返回地址连接 `/xiaoxin/v1/` 并完成一次语音链路。
      remaining:
        - 仍需保存一次真实固件 OTA 升级验收记录，包含设备、版本、固件包、下载地址和结果。
        - 仍需保存一次真机 WebSocket 连接验收记录，证明 OTA 地址和设备连接地址一致。
        - "`doorbell_mqtt` 解析、持久化、禁用语义和重启复用已有代码与主机测试；仍需归档真实 broker、重启和凭据轮换证据。"
        - 正式发布前仍需稳定 HTTPS/WSS 域名和反向代理方案，避免 IP 变化导致重烧录。
      acceptance:
        - 新固件默认不再请求上游 OTA 路径。
        - 未绑定设备能显示或播报激活码，绑定后能进入正常连接流程。
        - 设备能从私有 OTA 响应进入私有 WebSocket 并完成一次语音问答。
      related_items:
        - XIAOXIN-001
        - XIAOXIN-002
        - XIAOXIN-PROD-003
    - id: HW-01
      title: 语音播放、播报完成与 ACK
      priority: P0
      status: partial
      focus: 服务端 TTS 音频下发后，硬件端能播放、上报接收和完成状态，并让 delivery 时间线可信推进。
      implemented:
        - 固件端存在 `SendXiaoxinAck` 和 `xiaoxin_event` 处理路径。
        - 服务端已有 `xiaoxin_ack` 消息处理和 TTS 播放完成兜底逻辑。
        - 测试覆盖控制台投递、ACK 处理和 TTS 完成态回写。
        - 2026-07-12 服务端已修复 `tts.sentence_start` 首句字幕帧在旧音频流控器重置时丢失的问题；字幕帧现在直接携带当前 `sentence_id` 发送。
        - 真机台账已确认普通通知、课程提醒、待办提醒均完成 `device_received`/播报完成链路；可唤醒投递、`wake_timeout` 和 `device_offline` 失败路径也已有用户确认。
      requirements:
        - 硬件收到 `xiaoxin_event` 后至少回传 `device_received`。
        - 开启播报的投递需要区分正在播报、播报完成、播报失败和中断。
        - 服务端可以用音频发送完成作为第一版兜底，但需求账本必须标明这不是硬件真实播放完成证明。
        - 投递历史必须能追踪 event id、sentence id、delivery id 和 ACK 状态。
      remaining:
        - 需要归档本轮真机的 delivery_id、时间线、硬件照片/视频和服务端日志，避免用户确认无法复核。
        - 硬件真实播放完成事件仍需和服务端兜底完成态区分展示。
        - 播放失败、中断和用户打断时的状态回传仍需实机确认。
        - 串口已经能看到 TTS 字幕文本；屏幕底部字幕仍需补一份真机画面证据，串口日志本身不构成视觉验收。
      acceptance:
        - 控制台发送一条带播报通知后，设备显示通知、播放音频，并使 delivery 进入可信完成或明确失败状态。
        - 关闭播报的通知不会错误等待 TTS 完成。
        - 投递失败时通知历史能显示失败原因，而不是静默消失。
      related_items:
        - XIAOXIN-006
        - XIAOXIN-PROD-008
    - id: HW-02
      title: 通知中心与 heads-up 提醒
      priority: P0
      status: partial
      focus: 硬件端把课程提醒、普通提醒、系统状态和失败提示作为真实通知呈现，而不是聊天记录或静态样板。
      implemented:
        - 固件通知中心已支持 upsert、移除、单条清理、全部清理和优先级排序。
        - 低电量、Wi-Fi 断开、配网中和语音识别失败已接入通知路径。
        - 上课提醒 helper 已能把课程记录转换为通知事件。
        - 真机台账已确认普通通知、课程提醒和待办提醒可从控制台下发到硬件端，并完成通知呈现与 TTS 播报。
        - OTA 发现新版本、开始下载/安装和升级失败已接入真实通知中心，使用同一 OTA 通知进行 upsert。
      requirements:
        - 通知中心必须支持课程提醒、普通提醒、设备状态、OTA 状态和投递失败提示。
        - 同一类状态通知重复到达时更新已有卡片，不堆积。
        - heads-up 显示必须有优先级和冷却策略，避免打断语音主链路。
        - 通知条目需要能对应服务端 delivery id 或本地系统事件 id。
      remaining:
