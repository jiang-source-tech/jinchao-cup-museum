<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xiaoxin 项目状态工作台</title>
    <style>
      :root {
        --ink: #111827;
        --muted: #617083;
        --line: #d7dee8;
        --soft-line: #e8edf3;
        --panel: #ffffff;
        --field: #f7f9fc;
        --page: #eef3f6;
        --cyan: #087f8c;
        --cyan-soft: #e8f7f8;
        --green: #24754f;
        --green-soft: #e9f6ef;
        --amber: #a45f05;
        --amber-soft: #fff4df;
        --red: #b42318;
        --red-soft: #fff0ee;
        --blue: #275f9f;
        --blue-soft: #eaf2ff;
        --violet: #6941c6;
        --violet-soft: #f3efff;
        --shadow: 0 14px 34px rgba(17, 24, 39, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .page {
        min-height: 100vh;
        padding: 24px 28px 32px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: start;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.18;
        font-weight: 780;
      }

      .subtitle {
        max-width: 980px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .meta-box {
        min-width: 280px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: var(--shadow);
        font-size: 12px;
        color: var(--muted);
      }

      .meta-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
      }

      .meta-line strong {
        color: var(--ink);
        font-weight: 760;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(8, minmax(110px, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }

      .stat {
        min-height: 78px;
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .stat-label {
        color: var(--muted);
        font-size: 12px;
      }

      .stat-value {
        margin-top: 8px;
        font-size: 28px;
        line-height: 1;
        font-weight: 800;
      }

      .filters {
        display: grid;
        grid-template-columns: minmax(240px, 1.6fr) repeat(6, minmax(120px, 1fr));
        gap: 9px;
        margin-bottom: 14px;
        align-items: end;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        min-height: 35px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
      }

      .workspace {
        display: grid;
        grid-template-columns: 260px minmax(600px, 1fr) 390px;
        gap: 14px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .panel-header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--soft-line);
        background: #f8fafc;
        font-size: 13px;
        font-weight: 780;
      }

      .module-list {
        margin: 0;
        padding: 8px;
        list-style: none;
        display: grid;
        gap: 5px;
      }

      .module-group {
        padding: 8px 8px 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 780;
        text-transform: uppercase;
      }

      .module-button {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 7px 8px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .module-button:hover,
      .module-button.active {
        background: var(--cyan-soft);
        color: #056775;
      }

      .module-count {
        color: var(--muted);
        font-size: 12px;
      }

      .miniprogram-panel {
        margin: 14px 0;
      }

      .miniprogram-overview {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid var(--soft-line);
      }

      .miniprogram-summary,
      .miniprogram-recommendation,
      .miniprogram-state {
        padding: 12px;
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        background: var(--field);
        font-size: 13px;
        line-height: 1.55;
      }

      .miniprogram-recommendation {
        margin-top: 8px;
        border-color: #b7dccf;
        background: var(--green-soft);
      }

      .miniprogram-label {
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 780;
      }

      .miniprogram-state ul,
      .miniprogram-detail ul {
        margin: 0;
        padding-left: 18px;
      }

      .miniprogram-state li + li,
      .miniprogram-detail li + li {
        margin-top: 4px;
      }

      .miniprogram-workspace {
        display: grid;
        grid-template-columns: 230px minmax(520px, 1fr) 360px;
        min-height: 430px;
      }

      .miniprogram-nav {
        border-right: 1px solid var(--soft-line);
        background: #fbfcfe;
      }

      .miniprogram-nav-list {
        margin: 0;
        padding: 8px;
        list-style: none;
        display: grid;
        gap: 5px;
      }

      .miniprogram-table-scroll {
        max-height: 520px;
        overflow: auto;
      }

      .miniprogram-detail {
        max-height: 520px;
        border-left: 1px solid var(--soft-line);
        overflow: auto;
        background: #fff;
      }

      .miniprogram-links {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .table-scroll {
        max-height: calc(100vh - 322px);
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      thead {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #e9eef4;
      }

      th,
      td {
        padding: 10px 11px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: #526071;
        font-weight: 780;
        white-space: nowrap;
      }

      td {
        border-top: 1px solid var(--soft-line);
      }

      tbody tr {
        cursor: pointer;
      }

      tbody tr:hover,
      tbody tr.active {
        background: #f7fbfc;
      }

      .id {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .title-cell {
        min-width: 240px;
      }

      .title-main {
        font-weight: 760;
      }

      .summary {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 3px 7px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 720;
        white-space: nowrap;
      }

      .status-done {
        color: var(--green);
        background: var(--green-soft);
      }

      .status-partial,
      .status-active {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .status-todo,
      .status-deferred {
        color: var(--blue);
        background: var(--blue-soft);
      }

      .status-optimize {
        color: var(--violet);
        background: var(--violet-soft);
      }

      .status-blocked {
        color: var(--red);
        background: var(--red-soft);
      }

      .priority-P0 {
        color: var(--red);
        background: var(--red-soft);
      }

      .priority-P1 {
        color: var(--amber);
        background: var(--amber-soft);
      }

      .priority-P2,
      .priority-P3 {
        color: var(--blue);
        background: var(--blue-soft);
      }

      .detail {
        max-height: calc(100vh - 190px);
        overflow: auto;
      }

      .detail-body {
        padding: 14px;
      }

      .detail h2,
      .miniprogram-detail h2 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.25;
      }

      .detail-section {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--soft-line);
      }

      .detail-section h3 {
        margin: 0 0 8px;
        font-size: 13px;
      }

      .detail-section ul {
        margin: 0;
        padding-left: 18px;
        color: #263241;
        line-height: 1.55;
        font-size: 13px;
      }

      .detail-section li + li {
        margin-top: 5px;
      }

      .link-list {
        display: grid;
        gap: 7px;
      }

      .link-item {
        padding: 8px;
        border: 1px solid var(--soft-line);
        border-radius: 7px;
        background: var(--field);
        font-size: 12px;
        line-height: 1.45;
      }

      .path {
        display: block;
        margin-top: 3px;
        color: var(--blue);
        word-break: break-all;
      }

      .bottom-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        margin-top: 14px;
      }

      .milestones {
        display: grid;
        grid-template-columns: repeat(6, minmax(130px, 1fr));
        gap: 8px;
        padding: 12px;
      }

      .milestone {
        padding: 10px;
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        background: var(--field);
      }

      .milestone-title {
        font-size: 13px;
        font-weight: 780;
      }

      .milestone-summary {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .risk-list,
      .decision-list {
        display: grid;
        gap: 9px;
        padding: 12px;
      }

      .risk,
      .decision {
        padding: 10px;
        border: 1px solid var(--soft-line);
        border-radius: 8px;
        background: var(--field);
      }

      .risk-title,
      .decision-title {
        font-size: 13px;
        font-weight: 780;
      }

      .risk-text,
      .decision-text {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .error-panel {
        padding: 18px;
        border: 1px solid #f2b8b5;
        border-radius: 8px;
        background: var(--red-soft);
        color: var(--red);
      }

      .empty {
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 1180px) {
        .stats,
        .filters,
        .milestones {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .workspace,
        .miniprogram-workspace {
          grid-template-columns: 1fr;
        }

        .detail,
        .table-scroll,
        .miniprogram-table-scroll,
        .miniprogram-detail {
          max-height: none;
        }

        .miniprogram-nav,
        .miniprogram-detail {
          border-left: 0;
          border-right: 0;
          border-top: 1px solid var(--soft-line);
        }

        .bottom-grid,
        .topbar,
        .miniprogram-overview {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section id="app">
        <div class="empty">正在加载 Xiaoxin 项目状态...</div>
      </section>
    </main>

    <script>
      const state = {
        data: null,
        selectedId: null,
        selectedRequirementSections: {},
        selectedModule: "all",
        tableScrollTop: 0,
        filters: {
          query: "",
          area: "all",
          module: "all",
          status: "all",
          priority: "all",
          kind: "all",
          milestone: "all",
        },
      };

      const app = document.getElementById("app");

      function text(value) {
        return value == null ? "" : String(value);
      }

      function escapeHtml(value) {
        return text(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function taxonomyLabel(group, key) {
        return state.data?.taxonomy?.[group]?.[key] || key || "";
      }

      function statusClass(status) {
        return `status-${status || "todo"}`;
      }

      function priorityClass(priority) {
        return `priority-${priority || "P2"}`;
      }

      function byId(collection) {
        return Object.fromEntries((collection || []).map((item) => [item.id, item]));
      }

      function countBy(items, key) {
        return items.reduce((acc, item) => {
          acc[item[key]] = (acc[item[key]] || 0) + 1;
          return acc;
        }, {});
      }

      function isOpen(item) {
        return !["done", "deferred"].includes(item.status);
      }

      function filteredItems() {
        const items = state.data.items || [];
        return items.filter((item) => {
          const f = state.filters;
          const haystack = [
            item.id,
            item.title,
            item.summary,
            item.area,
            item.module,
            item.status,
            item.priority,
            item.kind,
            ...(item.implemented || []),
            ...(item.remaining || []),
            ...(item.optimizations || []),
          ]
            .join(" ")
            .toLowerCase();

          return (
            (!f.query || haystack.includes(f.query.toLowerCase())) &&
            (f.area === "all" || item.area === f.area) &&
            (f.module === "all" || item.module === f.module) &&
            (f.status === "all" || item.status === f.status) &&
            (f.priority === "all" || item.priority === f.priority) &&
            (f.kind === "all" || item.kind === f.kind) &&
            (f.milestone === "all" || item.milestone === f.milestone)
          );
        });
      }

      function optionList(map, selected) {
        return Object.entries(map || {})
          .map(([key, label]) => {
            const isSelected = key === selected ? "selected" : "";
            return `<option value="${escapeHtml(key)}" ${isSelected}>${escapeHtml(label)}</option>`;
          })
          .join("");
      }

      function moduleOptions(selected) {
        return (state.data.modules || [])
          .map((module) => {
            const isSelected = module.id === selected ? "selected" : "";
            return `<option value="${escapeHtml(module.id)}" ${isSelected}>${escapeHtml(module.name)}</option>`;
          })
          .join("");
      }

      function milestoneOptions(selected) {
        return (state.data.milestones || [])
          .map((milestone) => {
            const isSelected = milestone.id === selected ? "selected" : "";
            return `<option value="${escapeHtml(milestone.id)}" ${isSelected}>${escapeHtml(milestone.id)} · ${escapeHtml(milestone.name)}</option>`;
          })
          .join("");
      }

      function renderStats(items) {
        const total = state.data.items.length;
        const done = state.data.items.filter((item) => item.status === "done").length;
        const partial = state.data.items.filter((item) => item.status === "partial").length;
        const activeTodo = state.data.items.filter((item) => ["active", "todo"].includes(item.status)).length;
        const p0Open = state.data.items.filter((item) => item.priority === "P0" && isOpen(item)).length;
        const productRequirements = state.data.items.filter((item) => item.kind === "product_requirement").length;
        const integratedItems = state.data.integrated_companion_requirements?.columns?.length || 0;
        const miniprogramItems = state.data.mini_program_requirements?.columns?.length || 0;
        const hardwareItems = state.data.hardware_requirements?.columns?.length || 0;
        const companionGrowthItems = state.data.companion_growth_requirements?.columns?.length || 0;
        const companionProductizationItems = state.data.companion_productization_requirements?.columns?.length || 0;
        const risks = state.data.risks.length;
        const visible = items.length;

        return `
          <section class="stats">
            ${stat("总条目", total)}
            ${stat("当前可见", visible)}
            ${stat("已完成", done)}
            ${stat("部分完成", partial)}
            ${stat("P0 未闭环", p0Open)}
            ${stat("产品需求", productRequirements)}
            ${stat("一体化主线", integratedItems)}
            ${stat("小程序条目", miniprogramItems)}
            ${stat("硬件条目", hardwareItems)}
            ${stat("陪伴成长条目", companionGrowthItems)}
            ${stat("陪伴改进条目", companionProductizationItems)}
            ${stat("风险", risks)}
          </section>
        `;
      }

      function stat(label, value) {
        return `
          <div class="stat">
            <div class="stat-label">${escapeHtml(label)}</div>
            <div class="stat-value">${escapeHtml(value)}</div>
          </div>
        `;
      }

      function renderFilters() {
        const f = state.filters;
        return `
          <section class="filters">
            <label>
              搜索
              <input data-filter="query" value="${escapeHtml(f.query)}" placeholder="标题、摘要、模块、证据..." />
            </label>
            ${selectFilter("area", "领域", optionList(state.data.taxonomy.areas, f.area))}
            ${selectFilter("module", "模块", moduleOptions(f.module))}
            ${selectFilter("status", "状态", optionList(state.data.taxonomy.statuses, f.status))}
            ${selectFilter("priority", "优先级", optionList(state.data.taxonomy.priorities, f.priority))}
            ${selectFilter("kind", "类型", optionList(state.data.taxonomy.kinds, f.kind))}
            ${selectFilter("milestone", "阶段", milestoneOptions(f.milestone))}
          </section>
        `;
      }

      function selectFilter(key, label, options) {
        return `
          <label>
            ${escapeHtml(label)}
            <select data-filter="${escapeHtml(key)}">
              <option value="all">全部</option>
              ${options}
            </select>
          </label>
        `;
      }

      function renderList(values) {
        return (values || [])
          .map((value) => `<li>${escapeHtml(value)}</li>`)
          .join("");
      }

      function renderRequirementSection(sectionKey, options) {
        const section = state.data[sectionKey];
        if (!section || !Array.isArray(section.columns) || !section.columns.length) {
          return "";
        }

        state.selectedRequirementSections ||= {};

        const columns = section.columns;
        const selectedId = state.selectedRequirementSections[sectionKey];
        const selected =
          columns.find((column) => column.id === selectedId) || columns[0];
        state.selectedRequirementSections[sectionKey] = selected.id;
        const currentState = renderList(section.current_state);
        const navItems = columns
          .map((column) => {
            const active = column.id === selected.id ? "active" : "";
            return `
              <li>
                <button class="module-button ${active}" data-section-item="${escapeHtml(sectionKey)}:${escapeHtml(column.id)}">
                  <span>${escapeHtml(column.title)}</span>
                  <span class="module-count">${escapeHtml(column.id)}</span>
                </button>
              </li>
            `;
          })
          .join("");

        const rows = columns
          .map((column) => {
            const active = column.id === selected.id ? "active" : "";
            const relatedItems = (column.related_items || [])
              .map((id) => `<span class="badge status-optimize">${escapeHtml(id)}</span>`)
              .join("");
            return `
              <tr class="${active}" data-section-item="${escapeHtml(sectionKey)}:${escapeHtml(column.id)}">
                <td class="id">${escapeHtml(column.id)}</td>
                <td class="title-cell">
                  <div class="title-main">${escapeHtml(column.title)}</div>
                  <div class="summary">${escapeHtml(column.focus)}</div>
                </td>
                <td>
                  <div class="badge-row">
                    <span class="badge ${statusClass(column.status)}">${escapeHtml(taxonomyLabel("statuses", column.status))}</span>
                    <span class="badge ${priorityClass(column.priority)}">${escapeHtml(column.priority)}</span>
                  </div>
                </td>
                <td><div class="miniprogram-links">${relatedItems}</div></td>
              </tr>
            `;
          })
          .join("");

        return `
          <section id="requirements-section-${escapeHtml(sectionKey)}" class="panel miniprogram-panel">
            <div class="panel-header">${escapeHtml(section.title || options.defaultTitle)}</div>
            <div class="miniprogram-overview">
              <div>
                <div class="miniprogram-summary">
                  <div class="miniprogram-label">判断</div>
                  ${escapeHtml(section.summary)}
                </div>
                <div class="miniprogram-recommendation">
                  <div class="miniprogram-label">下一步推荐</div>
                  ${escapeHtml(section.recommendation)}
                </div>
              </div>
              <div class="miniprogram-state">
                <div class="miniprogram-label">当前状态</div>
                <ul>${currentState}</ul>
              </div>
            </div>
            <div class="miniprogram-workspace">
              <aside class="miniprogram-nav">
                <ul class="miniprogram-nav-list">
                  <li class="module-group">${escapeHtml(options.groupLabel)}</li>
                  <li>
                    <button class="module-button" data-section-item="${escapeHtml(sectionKey)}:${escapeHtml(columns[0].id)}">
                      <span>${escapeHtml(options.allLabel)}</span>
                      <span class="module-count">${columns.length}</span>
                    </button>
                  </li>
                  ${navItems}
                </ul>
              </aside>
              <div class="miniprogram-table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>条目</th>
                      <th>状态</th>
                      <th>关联条目</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
              ${renderRequirementDetail(selected, options.emptyText)}
            </div>
          </section>
        `;
      }

      function renderRequirementDetail(column, emptyText) {
        if (!column) {
          return `<aside class="miniprogram-detail"><div class="empty">${escapeHtml(emptyText)}</div></aside>`;
        }
        return `
          <aside class="miniprogram-detail">
            <div class="panel-header">需求详情</div>
            <div class="detail-body">
              <div class="badge-row">
                <span class="badge ${statusClass(column.status)}">${escapeHtml(taxonomyLabel("statuses", column.status))}</span>
                <span class="badge ${priorityClass(column.priority)}">${escapeHtml(column.priority)}</span>
              </div>
              <h2>${escapeHtml(column.id)} · ${escapeHtml(column.title)}</h2>
              <div class="summary">${escapeHtml(column.focus)}</div>
              ${detailList("已实现", column.implemented)}
              ${detailList("需求", column.requirements)}
              ${column.implementation_plan ? detailList("实施计划", column.implementation_plan) : ""}
              ${detailList("还需要做", column.remaining)}
              ${detailList("验收标准", column.acceptance)}
              ${sectionRelatedList(column.related_items)}
            </div>
          </aside>
        `;
      }

      function sectionRelatedList(values) {
        const list = values || [];
        if (!list.length) {
          return `
            <section class="detail-section">
              <h3>关联条目</h3>
              <div class="summary">暂无。</div>
            </section>
          `;
        }
        const badges = list
          .map((id) => `<span class="badge status-optimize">${escapeHtml(id)}</span>`)
          .join("");
        return `
          <section class="detail-section">
            <h3>关联条目</h3>
            <div class="miniprogram-links">${badges}</div>
          </section>
        `;
      }

      function renderWorkbenchNavigation(items) {
        const counts = countBy(state.data.items, "module");
        const modulesByArea = {};
        for (const module of state.data.modules || []) {
          modulesByArea[module.area] ||= [];
          modulesByArea[module.area].push(module);
        }

        const quickJumps = [
          state.data.integrated_companion_requirements?.columns?.length
            ? renderQuickJumpButton(
                "requirements-section-integrated_companion_requirements",
                "一体化主线",
                state.data.integrated_companion_requirements.columns.length
              )
            : "",
          state.data.companion_productization_requirements?.columns?.length
            ? renderQuickJumpButton(
                "requirements-section-companion_productization_requirements",
                "陪伴改进 P0",
                state.data.companion_productization_requirements.columns.length
              )
            : "",
          state.data.mini_program_requirements?.columns?.length
            ? renderQuickJumpButton(
                "requirements-section-mini_program_requirements",
                "小程序需求",
                state.data.mini_program_requirements.columns.length
              )
            : "",
          state.data.hardware_requirements?.columns?.length
            ? renderQuickJumpButton(
                "requirements-section-hardware_requirements",
                "硬件端需求",
                state.data.hardware_requirements.columns.length
              )
            : "",
          state.data.companion_growth_requirements?.columns?.length
            ? renderQuickJumpButton(
                "requirements-section-companion_growth_requirements",
                "陪伴成长需求",
                state.data.companion_growth_requirements.columns.length
              )
            : "",
          renderQuickJumpButton(
            "requirements-section-matrix",
            "服务端状态矩阵",
            items.length
          ),
        ].join("");

        const groups = Object.entries(modulesByArea)
          .map(([area, modules]) => {
            const buttons = modules
              .map((module) => {
                const active = state.filters.module === module.id ? "active" : "";
                return `
                  <li>
                    <button class="module-button ${active}" data-module="${escapeHtml(module.id)}">
                      <span>${escapeHtml(module.name)}</span>
                      <span class="module-count">${counts[module.id] || 0}</span>
                    </button>
                  </li>
                `;
              })
              .join("");
            return `
              <li class="module-group">${escapeHtml(taxonomyLabel("areas", area))}</li>
              ${buttons}
            `;
          })
          .join("");

        const allActive = state.filters.module === "all" ? "active" : "";
        return `
          <aside class="panel">
            <div class="panel-header">工作台导航</div>
            <ul class="module-list">
              <li class="module-group">快速定位</li>
              ${quickJumps}
              <li class="module-group">模块筛选</li>
              <li>
                <button class="module-button ${allActive}" data-module="all">
                  <span>全部模块</span>
                  <span class="module-count">${state.data.items.length}</span>
                </button>
              </li>
              ${groups}
            </ul>
          </aside>
        `;
      }

      function renderQuickJumpButton(targetId, label, count) {
        return `
          <li>
            <button class="module-button" data-jump-target="${escapeHtml(targetId)}">
              <span>${escapeHtml(label)}</span>
              <span class="module-count">${escapeHtml(count)}</span>
            </button>
          </li>
        `;
      }

      function renderTable(items) {
        if (!items.length) {
          return `<section class="panel"><div class="empty">没有匹配的条目。</div></section>`;
        }

        const rows = items
          .map((item) => {
            const active = item.id === state.selectedId ? "active" : "";
            return `
              <tr class="${active}" data-item="${escapeHtml(item.id)}">
                <td class="id">${escapeHtml(item.id)}</td>
                <td class="title-cell">
                  <div class="title-main">${escapeHtml(item.title)}</div>
                  <div class="summary">${escapeHtml(item.summary)}</div>
                </td>
                <td>
                  <div class="badge-row">
                    <span class="badge ${statusClass(item.status)}">${escapeHtml(taxonomyLabel("statuses", item.status))}</span>
                    <span class="badge ${priorityClass(item.priority)}">${escapeHtml(item.priority)}</span>
                  </div>
                </td>
                <td>
                  <span class="badge status-optimize">${escapeHtml(taxonomyLabel("kinds", item.kind))}</span>
                </td>
                <td>${escapeHtml(moduleName(item.module))}</td>
                <td>${escapeHtml(item.milestone)}</td>
              </tr>
            `;
          })
          .join("");

        return `
          <section class="panel">
            <div class="panel-header">状态矩阵</div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>条目</th>
                    <th>状态</th>
                    <th>类型</th>
                    <th>模块</th>
                    <th>阶段</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </section>
        `;
      }

      function moduleName(id) {
        return (state.data.modules || []).find((module) => module.id === id)?.name || id;
      }

      function selectedItem(items) {
        const all = state.data.items || [];
        if (state.selectedId) {
          const explicit = all.find((item) => item.id === state.selectedId);
          if (explicit && items.some((item) => item.id === explicit.id)) {
            return explicit;
          }
        }
        return items[0] || all[0];
      }

      function renderDetail(item) {
        if (!item) {
          return `<aside class="panel detail"><div class="empty">选择一个条目查看详情。</div></aside>`;
        }
        state.selectedId = item.id;
        return `
          <aside class="panel detail">
            <div class="panel-header">条目详情</div>
            <div class="detail-body">
              <div class="badge-row">
                <span class="badge ${statusClass(item.status)}">${escapeHtml(taxonomyLabel("statuses", item.status))}</span>
                <span class="badge ${priorityClass(item.priority)}">${escapeHtml(item.priority)}</span>
                <span class="badge status-todo">${escapeHtml(taxonomyLabel("areas", item.area))}</span>
                <span class="badge status-optimize">${escapeHtml(taxonomyLabel("kinds", item.kind))}</span>
              </div>
              <h2>${escapeHtml(item.title)}</h2>
              <div class="summary">${escapeHtml(item.summary)}</div>
              ${detailList("已实现", item.implemented)}
              ${detailList("还需要做", item.remaining)}
              ${detailList("可优化", item.optimizations)}
              ${detailList("验收标准", item.acceptance)}
              ${linkList("证据", item.evidence)}
              ${linkList("关联", item.related)}
            </div>
          </aside>
        `;
      }

      function detailList(title, values) {
        const list = values || [];
        if (!list.length) {
          return `
            <section class="detail-section">
              <h3>${escapeHtml(title)}</h3>
              <div class="summary">暂无。</div>
            </section>
          `;
        }
        return `
          <section class="detail-section">
            <h3>${escapeHtml(title)}</h3>
            <ul>${list.map((value) => `<li>${escapeHtml(value)}</li>`).join("")}</ul>
          </section>
        `;
      }

      function linkList(title, values) {
        const list = values || [];
        if (!list.length) {
          return `
            <section class="detail-section">
              <h3>${escapeHtml(title)}</h3>
              <div class="summary">暂无。</div>
            </section>
          `;
        }
        return `
          <section class="detail-section">
            <h3>${escapeHtml(title)}</h3>
            <div class="link-list">
              ${list
                .map((item) => {
                  if (typeof item === "string") {
                    return `<div class="link-item">${escapeHtml(item)}</div>`;
                  }
                  return `
                    <div class="link-item">
                      <strong>${escapeHtml(item.type || "ref")}</strong>
                      ${item.note ? `<span> · ${escapeHtml(item.note)}</span>` : ""}
                      ${item.path ? `<span class="path">${escapeHtml(item.path)}</span>` : ""}
                    </div>
                  `;
                })
                .join("")}
            </div>
          </section>
        `;
      }

      function renderMilestones() {
        const cards = (state.data.milestones || [])
          .map((milestone) => `
            <article class="milestone">
              <div class="badge ${statusClass(milestone.status)}">${escapeHtml(taxonomyLabel("statuses", milestone.status))}</div>
              <div class="milestone-title">${escapeHtml(milestone.id)} 路 ${escapeHtml(milestone.name)}</div>
              <div class="milestone-summary">${escapeHtml(milestone.summary)}</div>
            </article>
          `)
          .join("");

        return `
          <section class="panel">
            <div class="panel-header">里程碑路线</div>
            <div class="milestones">${cards}</div>
          </section>
        `;
      }

      function renderRisksAndDecisions() {
        const risks = (state.data.risks || [])
          .map((risk) => `
            <article class="risk">
              <div class="badge status-blocked">${escapeHtml(risk.severity)}</div>
              <div class="risk-title">${escapeHtml(risk.title)}</div>
              <div class="risk-text">${escapeHtml(risk.summary)}</div>
              <div class="risk-text"><strong>缓解：</strong>${escapeHtml((risk.mitigation || []).join(" "))}</div>
            </article>
          `)
          .join("");

        const decisions = (state.data.decisions || [])
          .map((decision) => `
            <article class="decision">
              <div class="badge status-done">${escapeHtml(decision.date)}</div>
              <div class="decision-title">${escapeHtml(decision.title)}</div>
              <div class="decision-text">${escapeHtml(decision.decision)}</div>
              <div class="decision-text">${escapeHtml(decision.rationale)}</div>
            </article>
          `)
          .join("");

        return `
          <section class="bottom-grid">
            <div class="panel">
              <div class="panel-header">风险</div>
              <div class="risk-list">${risks}</div>
            </div>
            <div class="panel">
              <div class="panel-header">关键决策</div>
              <div class="decision-list">${decisions}</div>
            </div>
          </section>
        `;
      }

      function render() {
        const currentScroller = document.querySelector(".table-scroll");
        if (currentScroller) {
          state.tableScrollTop = currentScroller.scrollTop;
        }
        const pageScrollTop = window.scrollY || document.documentElement.scrollTop || 0;

        const items = filteredItems();
        const item = selectedItem(items);
        const meta = state.data.meta || {};

        app.innerHTML = `
          <header class="topbar">
            <div>
              <h1>${escapeHtml(meta.display_title || meta.title)}</h1>
              <div class="subtitle">${escapeHtml(meta.description)}</div>
            </div>
            <div class="meta-box">
              <div class="meta-line"><span>版本</span><strong>${escapeHtml(meta.version)}</strong></div>
              <div class="meta-line"><span>更新</span><strong>${escapeHtml(meta.updated)}</strong></div>
              <div class="meta-line"><span>负责人</span><strong>${escapeHtml(meta.owner)}</strong></div>
              <div class="meta-line"><span>来源</span><strong>${escapeHtml(meta.source_file)}</strong></div>
            </div>
          </header>
          ${renderStats(items)}
          ${renderFilters()}
          ${renderRequirementSection("integrated_companion_requirements", {
            defaultTitle: "项目一体化主线",
            groupLabel: "一体化主线",
            allLabel: "全部一体化主线",
            emptyText: "选择一个一体化主线需求查看详情。",
          })}
          ${renderRequirementSection("companion_productization_requirements", {
            defaultTitle: "陪伴记忆产品化改进（P0）",
            groupLabel: "陪伴产品化",
            allLabel: "全部陪伴改进",
            emptyText: "选择一个陪伴改进需求查看详情。",
          })}
          ${renderRequirementSection("mini_program_requirements", {
            defaultTitle: "学生侧小程序需求",
            groupLabel: "学生侧小程序",
            allLabel: "全部小程序需求",
            emptyText: "选择一个小程序需求查看详情。",
          })}
          ${renderRequirementSection("hardware_requirements", {
            defaultTitle: "硬件端需求",
            groupLabel: "硬件端",
            allLabel: "全部硬件需求",
            emptyText: "选择一个硬件需求查看详情。",
          })}
          ${renderRequirementSection("companion_growth_requirements", {
            defaultTitle: "陪伴成长需求",
            groupLabel: "陪伴成长",
            allLabel: "全部陪伴成长需求",
            emptyText: "选择一个陪伴成长需求查看详情。",
          })}
          <section id="requirements-section-matrix" class="workspace">
            ${renderWorkbenchNavigation(items)}
            ${renderTable(items)}
            ${renderDetail(item)}
          </section>
          ${renderMilestones()}
          ${renderRisksAndDecisions()}
        `;

        attachHandlers();
        restoreTableScroll();
        requestAnimationFrame(() => {
          window.scrollTo({ top: pageScrollTop, left: 0, behavior: "auto" });
        });
      }

      function restoreTableScroll() {
        const scroller = document.querySelector(".table-scroll");
        if (scroller) {
          scroller.scrollTop = state.tableScrollTop || 0;
        }
      }

      function attachHandlers() {
        document.querySelectorAll("[data-filter]").forEach((control) => {
          control.addEventListener("input", (event) => {
            const key = event.currentTarget.dataset.filter;
            state.filters[key] = event.currentTarget.value;
            if (key === "module") {
              state.selectedModule = event.currentTarget.value;
            }
            render();
          });
        });

        document.querySelectorAll("[data-module]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const module = event.currentTarget.dataset.module;
            state.filters.module = module;
            render();
          });
        });

        document.querySelectorAll("[data-jump-target]").forEach((button) => {
          button.addEventListener("click", (event) => {
            const targetId = event.currentTarget.dataset.jumpTarget;
            const target = targetId ? document.getElementById(targetId) : null;
            if (!target) {
              return;
            }
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        });

        document.querySelectorAll("[data-item]").forEach((row) => {
          row.addEventListener("click", (event) => {
            state.selectedId = event.currentTarget.dataset.item;
            render();
          });
        });

        document.querySelectorAll("[data-section-item]").forEach((row) => {
          row.addEventListener("click", (event) => {
            const value = event.currentTarget.dataset.sectionItem || "";
            const separator = value.indexOf(":");
            if (separator < 1) {
              return;
            }
            const sectionKey = value.slice(0, separator);
            const itemId = value.slice(separator + 1);
            state.selectedRequirementSections ||= {};
            state.selectedRequirementSections[sectionKey] = itemId;
            render();
          });
        });
      }

      function renderError(title, messages) {
        app.innerHTML = `
          <section class="error-panel">
            <h1>${escapeHtml(title)}</h1>
            <p>${messages.map(escapeHtml).join("<br />")}</p>
            <p>启动方式：进入 <strong>docs\\requirements</strong> 后运行 <strong>python server.py --port 8080</strong>。</p>
          </section>
        `;
      }

      async function boot() {
        try {
          const response = await fetch("/requirements.json", { cache: "no-store" });
          if (!response.ok) {
            renderError("无法加载 requirements.json", [`HTTP ${response.status}`]);
            return;
          }
          const payload = await response.json();
          if (!payload.ok) {
            renderError("YAML 校验失败", payload.errors || ["未知错误"]);
            return;
          }
          state.data = payload.data;
          render();
        } catch (error) {
          renderError("无法连接本地工作台服务", [
            "直接打开 HTML 文件时无法读取 YAML。",
            `错误：${error.message}`,
          ]);
        }
      }

      boot();
    </script>
  </body>
</html>
