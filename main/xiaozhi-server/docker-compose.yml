name: jinchao-museum

services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: jinchao-museum-qdrant
    restart: always
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "</dev/tcp/127.0.0.1/6333"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - type: bind
        source: ${MUSEUM_DATA_DIR:-./museum-data}/qdrant
        target: /qdrant/storage

  museum-server:
    image: jinchao-museum-server:${MUSEUM_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile-server
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
    container_name: jinchao-museum-server
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/museum/health/live', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MUSEUM_QDRANT_URL=${MUSEUM_QDRANT_URL:-http://qdrant:6333}
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于简单OTA接口(单服务部署)，以及视觉分析接口
      - "8003:8003"
    volumes:
      # 默认使用独立目录；生产必须显式设置为仓库外的博物馆数据目录。
      - type: bind
        source: ${MUSEUM_DATA_DIR:-./museum-data}
        target: /opt/jinchao-museum-server/data
