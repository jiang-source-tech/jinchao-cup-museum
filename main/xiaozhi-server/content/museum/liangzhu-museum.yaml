exhibits:
  - id: liangzhu-jade-yue-set
    zone_id: liangzhu-official-collection
    name: 玉钺组合
    aliases:
      - text: 玉钺
        kind: common
        binding: unique
        sources: [source-liangzhu-yue-museum-overview]
      - text: 反山M14玉钺组合
        kind: historical
        binding: unique
        sources: [source-liangzhu-yue-m14-interview]
      - text: 玉越组合
        kind: asr_variant
        binding: unique
        sources: [source-liangzhu-yue-museum-overview]
      - text: 反山M十四玉钺组合
        kind: asr_variant
        binding: unique
        sources: [source-liangzhu-yue-m14-interview]
    status: active
    revision:
      id: liangzhu-jade-yue-set-r2
      number: 2
      status: draft
      facts:
        - id: fact-liangzhu-yue-era-r2
          type: era
          statement: 这组玉钺属于距今约五千年的良渚文化时期，所在社会已经形成以大型工程、等级墓地和礼制玉器为特征的早期区域性国家形态。
          keywords: [年代, 良渚文化, 五千年, 早期国家, 历史背景]
          confidence: unesco_and_official_archaeology
          certainty: qualified
          sources: [source-liangzhu-unesco-background]
        - id: fact-liangzhu-yue-excavation-r2
          type: excavation
          statement: 这组玉钺出土于1986年发掘的反山遗址M14；考古人员逐颗保留玉钺附近小玉粒的位置，识别出一条由近百颗玉粒组成、长约70厘米的玉粒带。
          keywords: [反山遗址, M14, 1986年, 出土, 玉粒带, 70厘米]
          confidence: excavator_interview
          certainty: confirmed
          sources: [source-liangzhu-yue-m14-interview]
        - id: fact-liangzhu-yue-composition-r2
          type: appearance
          statement: 完整组合由玉钺、玉瑁、玉镦、近百颗小玉粒和已经腐烂的木质柲构成，复原后是一件装饰华丽的长柄仪仗性武器。
          keywords: [组成, 玉瑁, 玉镦, 玉粒, 木质柲, 仪仗性武器, 复原]
          confidence: official_archaeology_reconstruction
          certainty: qualified
          sources:
            - source-liangzhu-yue-m14-interview
        - id: fact-liangzhu-yue-dimensions-r2
          type: dimensions
          statement: 其中玉钺长14.1厘米，上端宽9.3厘米，刃部宽11厘米，最厚约0.9厘米。
          keywords: [尺寸, 长, 上端宽, 刃部宽, 厚, 厘米]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources: [source-liangzhu-yue-museum-overview]
        - id: fact-liangzhu-yue-material-r2
          type: material
          statement: 组合中的玉钺、玉瑁、玉镦和小玉粒均为玉质部件，原有把柄为木质，出土时木柄已经腐烂。
          keywords: [材质, 玉钺, 玉瑁, 玉镦, 玉粒, 木柄, 腐烂]
          confidence: official_archaeology_interview
          certainty: confirmed
          sources: [source-liangzhu-yue-m14-interview]
        - id: fact-liangzhu-yue-craft-r2
          type: craft
          statement: 玉钺上端可见双向片切割痕迹，补缺玉件与台阶状缺口相合，切割面又经过打磨，说明制作者在成形后还进行了装配和修整。
          keywords: [工艺, 双向片切割, 补缺, 台阶状缺口, 打磨, 装配]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources: [source-liangzhu-yue-museum-overview]
        - id: fact-liangzhu-yue-usage-r2
          type: usage
          statement: 玉钺源于武器形态，但良渚高等级墓葬中的精制玉钺更主要用于表现军事统率权和持有者的等级身份，而不是普通砍击工具。
          keywords: [用途, 武器形态, 军事统率权, 权力象征, 身份]
          confidence: museum_research_interpretation
          certainty: qualified
          sources:
            - source-national-museum-liangzhu-yue
            - source-liangzhu-yue-m14-interview
        - id: fact-liangzhu-yue-research-limit-r2
          type: research_limit
          statement: 原木柄已经腐烂，当前复原依靠约70厘米玉粒带、玉瑁和玉镦的出土位置推断部件关系，仍不能直接观察玉粒的固定细节和实际持握动作。
          keywords: [争议, 未解, 复原, 木柄, 玉粒带, 装配, 使用动作]
          confidence: evidence_boundary_from_excavation
          certainty: unknown
          sources: [source-liangzhu-yue-m14-interview]

  - id: liangzhu-jade-trident
    zone_id: liangzhu-official-collection
    name: 玉三叉形器
    aliases:
      - text: 三叉形器
        kind: common
        binding: unique
        sources: [source-liangzhu-trident-museum-record]
      - text: 瑶山M7玉三叉形器
        kind: historical
        binding: unique
        sources: [source-liangzhu-trident-museum-record]
      - text: 三叉型器
        kind: asr_variant
        binding: unique
        sources: [source-liangzhu-trident-museum-record]
      - text: 瑶山M七玉三叉型器
        kind: asr_variant
        binding: unique
        sources: [source-liangzhu-trident-museum-record]
    status: active
    revision:
      id: liangzhu-jade-trident-r2
      number: 2
      status: draft
      facts:
        - id: fact-liangzhu-trident-era-r2
          type: era
          statement: 这件玉三叉形器属于良渚文化时期，其社会背景与大型工程、等级墓地和礼制玉器共同构成的早期国家形态有关。
          keywords: [年代, 良渚文化, 五千年, 早期国家, 历史背景]
          confidence: unesco_and_official_museum
          certainty: qualified
          sources: [source-liangzhu-unesco-background]
        - id: fact-liangzhu-trident-excavation-r2
          type: excavation
          statement: 它出土于1987年发掘的瑶山遗址M7，出土时位于墓主人头部，是判断其佩戴方式的重要依据。
          keywords: [瑶山遗址, M7, 1987年, 出土, 头部, 发现]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources: [source-liangzhu-trident-museum-study-2022]
        - id: fact-liangzhu-trident-dimensions-r2
          type: dimensions
          statement: 这件玉三叉形器高4.8厘米、宽8.5厘米、厚0.8厘米。
          keywords: [尺寸, 高, 宽, 厚, 厘米]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources: [source-liangzhu-trident-museum-record]
        - id: fact-liangzhu-trident-material-r2
          type: material
          statement: 这件器物为南瓜黄色玉器，中叉和左右两叉共同构成横向展开的三叉形轮廓。
          keywords: [材质, 玉器, 南瓜黄, 三叉形, 轮廓]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources: [source-liangzhu-trident-museum-record]
        - id: fact-liangzhu-trident-craft-r2
          type: craft
          statement: 器物一面以细密阴线刻出神人头像、羽状纹和兽面纹；中叉有竖向钻孔，可与配套玉管连接使用。
          keywords: [工艺, 神人头像, 羽状纹, 兽面纹, 阴线刻, 竖向孔, 玉管]
          confidence: official_museum_collection_page
          certainty: confirmed
          sources:
            - source-liangzhu-trident-museum-record
            - source-liangzhu-trident-museum-study-2022
        - id: fact-liangzhu-trident-usage-r2
          type: usage
          statement: 根据墓主人头部的出土位置和玉管组合关系，良渚博物院将它解释为男性贵族冠帽上的头饰。
          keywords: [用途, 冠帽饰, 头饰, 头部, 男性贵族, 干什么用]
          confidence: official_museum_research_interpretation
          certainty: qualified
          sources: [source-liangzhu-trident-museum-study-2022]
        - id: fact-liangzhu-trident-reconstruction-hairpin-r2
          type: research_limit
          statement: 良渚博物院2022年文章提出一种冠帽饰复原方案：以发簪穿过配套玉管和三叉形器钻孔，将它固定在头部；文章明确把这种方式写成专家推测。
          keywords: [争议, 复原, 佩戴, 玉管, 发簪, 冠帽饰, 专家推测]
          confidence: official_reconstruction_hypothesis
          certainty: qualified
          sources: [source-liangzhu-trident-museum-study-2022]
        - id: fact-liangzhu-trident-reconstruction-headband-r2
          type: research_limit
          statement: 良渚博物院2025年发布的学术会议纪要记录了另一种解释：三叉形器并非发笄，而是穿缀在男性贵族额带上的玉饰。
          keywords: [争议, 复原, 佩戴, 发笄, 额带, 男性贵族, 不同观点]
          confidence: symposium_interpretation_update
          certainty: disputed
          sources: [source-liangzhu-trident-reconstruction-discussion]
