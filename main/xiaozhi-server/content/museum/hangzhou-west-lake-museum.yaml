exhibits:
  - id: southern-song-guan-zun-incense-burner
    zone_id: west-lake-official-collection
    name: 南宋官窑青瓷樽式炉
    aliases: [青瓷樽式炉, 官窑樽式炉, 樽式炉]
    status: active
    revision:
      id: southern-song-guan-zun-incense-burner-r1
      number: 1
      status: draft
      facts:
        - id: fact-west-lake-zun-era
          type: era
          statement: 这件青瓷樽式炉烧造于南宋时期。
          keywords: [年代, 南宋, 时期]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-dimensions
          type: dimensions
          statement: 南宋官窑青瓷樽式炉高8.8厘米、口径12.5厘米、底径10.3厘米。
          keywords: [尺寸, 高, 口径, 底径]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-appearance
          type: appearance
          statement: 这件樽式炉口部微敞、折沿平口、腹部呈直筒形、下承圈足，外壁饰七道凸弦纹。
          keywords: [外形, 直筒形, 圈足, 七道, 凸弦纹]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-material
          type: material
          statement: 器物为灰色胎，施青灰色釉，口沿和足沿露出紫褐色胎，釉面布满开片纹。
          keywords: [材质, 灰色胎, 青灰色釉, 紫褐色胎, 开片]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]

