exhibits:
  - id: southern-song-guan-zun-incense-burner
    zone_id: west-lake-official-collection
    name: 南宋官窑青瓷樽式炉
    aliases: [青瓷樽式炉, 官窑樽式炉, 樽式炉, 青瓷尊式炉, 官窑尊式炉, 尊式炉]
    status: active
    revision:
      id: southern-song-guan-zun-incense-burner-r1
      number: 1
      status: draft
      facts:
        - id: fact-west-lake-zun-era
          type: era
          statement: 这件青瓷樽式炉烧造于南宋时期。
          keywords: [年代, 南宋, 时期]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-excavation
          type: excavation
          statement: 这件南宋官窑青瓷樽式炉出土于老虎洞窑址。
          keywords: [出土, 老虎洞窑址, 窑址]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-dimensions
          type: dimensions
          statement: 南宋官窑青瓷樽式炉高14.8厘米、口径19.5厘米、底径18.7厘米。
          keywords: [尺寸, 高, 口径, 底径]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-appearance
          type: appearance
          statement: 这件樽式炉为直口、方唇、筒腹和平底内凹结构，下有三个兽蹄形足，外腹饰四组三道凸弦纹。
          keywords: [外形, 直口, 方唇, 筒腹, 兽蹄形足, 凸弦纹]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]
        - id: fact-west-lake-zun-material
          type: material
          statement: 器物为较厚的浅灰胎，施较薄的灰青釉，釉面有细密开片，外底留有六个支钉痕。
          keywords: [材质, 浅灰胎, 灰青釉, 细密开片, 支钉痕]
          confidence: official_museum_webpage
          sources: [source-west-lake-zun-incense-burner-850]

