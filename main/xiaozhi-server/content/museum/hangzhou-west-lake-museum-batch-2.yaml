          keywords: [材质, 红褐色, 瓷土胎, 胎质]
          confidence: official_museum_webpage
          sources: [source-west-lake-dasong-guowu-sagger-pad-856]
        - id: fact-west-lake-sagger-pad-craft
          type: craft
          statement: 垫饼平面刻划“大宋国物”四字，表面还留有垫烧小圈足的印痕。
          keywords: [工艺, 刻划, 大宋国物, 垫烧, 圈足印痕]
          confidence: official_museum_webpage
          sources: [source-west-lake-dasong-guowu-sagger-pad-856]

  - id: five-dynasties-northern-song-yue-celadon-cup-stand
    zone_id: west-lake-official-collection
    name: 五代至北宋越窑青釉水波纹盏托
    aliases: [越窑青釉水波纹盏托, 水波纹盏托, 越窑盏托]
    status: active
    revision:
      id: five-dynasties-northern-song-yue-celadon-cup-stand-r1
      number: 1
      status: draft
      facts:
        - id: fact-west-lake-yue-cup-stand-era
          type: era
          statement: 馆方将这件青釉水波纹盏托定为五代至北宋时期的浙江越窑产品。
          keywords: [年代, 五代, 北宋, 浙江, 越窑]
          confidence: official_museum_webpage
          sources: [source-west-lake-yue-celadon-cup-stand-858]
        - id: fact-west-lake-yue-cup-stand-dimensions
          type: dimensions
          statement: 盏托高7厘米、托口4.5厘米、盏口13.2厘米。
          keywords: [尺寸, 高, 托口, 盏口, 厘米]
          confidence: official_museum_webpage
          sources: [source-west-lake-yue-celadon-cup-stand-858]
        - id: fact-west-lake-yue-cup-stand-appearance
          type: appearance
          statement: 盏托的托盘呈花瓣状并刻水草形纹饰，中央有鼓腹托座，托座饰连珠纹和覆莲瓣。
          keywords: [外形, 花瓣, 水草纹, 托座, 连珠纹, 覆莲瓣]
          confidence: official_museum_webpage
          sources: [source-west-lake-yue-celadon-cup-stand-858]
        - id: fact-west-lake-yue-cup-stand-material
          type: material
          statement: 盏托通体施青釉，釉色青中泛绿，釉面滋润匀净。
          keywords: [材质, 青釉, 青中泛绿, 釉面]
          confidence: official_museum_webpage
          sources: [source-west-lake-yue-celadon-cup-stand-858]
        - id: fact-west-lake-yue-cup-stand-usage
          type: usage
          statement: 盏托中央凸起的鼓腹托座用于承托杯盘。
          keywords: [用途, 承托, 杯盘, 托座]
          confidence: official_museum_webpage
          sources: [source-west-lake-yue-celadon-cup-stand-858]

  - id: three-kingdoms-celadon-funerary-jar
    zone_id: west-lake-official-collection
    name: 三国青釉堆塑罐
    aliases: [青釉堆塑罐, 堆塑罐, 谷仓, 魂瓶, 三国魂瓶]
    status: active
    revision:
      id: three-kingdoms-celadon-funerary-jar-r1
      number: 1
      status: draft
      facts:
        - id: fact-west-lake-funerary-jar-era
          type: era
          statement: 馆方将这件青釉堆塑罐定为三国时期器物。
          keywords: [年代, 三国, 时期]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
        - id: fact-west-lake-funerary-jar-dimensions
          type: dimensions
          statement: 堆塑罐高35.6厘米、口径12厘米、足径15.4厘米。
          keywords: [尺寸, 高, 口径, 足径, 厘米]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
        - id: fact-west-lake-funerary-jar-appearance
          type: appearance
          statement: 堆塑罐深腹平底，上部为连体五罐，肩部堆塑人物、飞鸟和胡人脸。
          keywords: [外形, 深腹, 平底, 五罐, 堆塑, 人物, 飞鸟, 胡人脸]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
        - id: fact-west-lake-funerary-jar-material
          type: material
          statement: 这件堆塑罐通体施青釉，器物保存完整，釉面光润。
          keywords: [材质, 青釉, 釉面, 光润, 完整]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
        - id: fact-west-lake-funerary-jar-usage
          type: usage
          statement: 馆方说明，堆塑罐又称谷仓或魂瓶，是三国两晋时期长江中下游地区较常见的陪葬器物。
          keywords: [用途, 谷仓, 魂瓶, 陪葬器物, 长江中下游]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
        - id: fact-west-lake-funerary-jar-history
          type: history
          statement: 馆方认为，罐上的人物和胡人脸等堆塑反映了当时的中外交流，是研究社会历史的实物资料。
          keywords: [意义, 中外交流, 社会历史, 实物资料, 胡人脸]
          confidence: official_museum_webpage
          sources: [source-west-lake-three-kingdoms-celadon-funerary-jar-859]
