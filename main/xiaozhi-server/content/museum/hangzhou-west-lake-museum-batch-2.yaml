          keywords: [年代, 南宋, 官窑]
          confidence: official_museum_webpage
          sources: [source-west-lake-dasong-guowu-sagger-pad-856]
        - id: fact-west-lake-sagger-pad-excavation
          type: excavation
          statement: 这件“大宋国物”垫饼出土于郊坛下窑址。
          keywords: [出土, 郊坛下窑址, 窑址]
          confidence: official_museum_webpage
          sources: [source-west-lake-dasong-guowu-sagger-pad-856]
        - id: fact-west-lake-sagger-pad-dimensions
          type: dimensions
          statement: 垫饼高1厘米、直径5.5厘米、足径3.2厘米。
          keywords: [尺寸, 高, 直径, 足径, 厘米]
          confidence: official_museum_webpage
