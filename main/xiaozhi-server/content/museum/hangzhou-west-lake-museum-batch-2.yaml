exhibits:
  - id: southern-song-guan-gui-incense-burner
    zone_id: west-lake-official-collection
    name: 南宋官窑青瓷簋式炉
    aliases: [青瓷簋式炉, 官窑簋式炉, 簋式炉, 青瓷鬼式炉]
    status: active
    revision:
      id: southern-song-guan-gui-incense-burner-r1
      number: 1
      status: draft
      facts:
        - id: fact-west-lake-gui-era
          type: era
          statement: 这件青瓷簋式炉为南宋官窑器物。
          keywords: [年代, 南宋, 官窑]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]
        - id: fact-west-lake-gui-excavation
          type: excavation
          statement: 这件南宋官窑青瓷簋式炉出土于郊坛下窑址。
          keywords: [出土, 郊坛下窑址, 窑址]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]
        - id: fact-west-lake-gui-dimensions
          type: dimensions
          statement: 青瓷簋式炉高10.5厘米、口径17厘米、底径13.5厘米。
          keywords: [尺寸, 高, 口径, 底径, 厘米]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]
        - id: fact-west-lake-gui-appearance
          type: appearance
          statement: 簋式炉仿商周青铜簋式样，侈口束颈，大圈足外撇，腹部有弦纹和龙首形双环耳。
          keywords: [外形, 青铜簋, 侈口, 束颈, 圈足, 弦纹, 龙首, 双环耳]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]
        - id: fact-west-lake-gui-material
          type: material
          statement: 簋式炉为细致灰胎，施粉青色厚釉，器身密布大小适中的纹片。
          keywords: [材质, 灰胎, 粉青釉, 厚釉, 纹片]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]
        - id: fact-west-lake-gui-usage
          type: usage
          statement: 馆方说明，这件簋式炉用于南宋宫廷礼仪活动。
          keywords: [用途, 宫廷, 礼仪活动]
          confidence: official_museum_webpage
          sources: [source-west-lake-gui-incense-burner-854]

