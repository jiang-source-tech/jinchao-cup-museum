        - id: fact-west-lake-sagger-pad-appearance
          type: appearance
          statement: 垫饼饼面平整、底有矮足，边沿呈斜弧形，平面刻有“大宋国物”四字。
          keywords: [外形, 饼面, 矮足, 大宋国物, 刻字, 题铭]
          confidence: official_museum_webpage
