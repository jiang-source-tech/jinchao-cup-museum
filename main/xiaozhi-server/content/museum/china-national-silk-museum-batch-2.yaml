exhibits:
  - id: northern-dynasties-figured-damask-robe
    zone_id: china-silk-official-collection
    name: 环人物纹绫袍
    aliases: [北朝环人物纹绫袍, 套环人物纹绫袍, 北朝绫袍]
    status: active
    revision:
      id: northern-dynasties-figured-damask-robe-r1
      number: 1
      status: draft
      facts:
        - id: fact-silk-figured-damask-robe-era
          type: era
          statement: 馆方将这件环人物纹绫袍定为北朝时期藏品，文物级别为二级。
          keywords: [年代, 北朝, 二级文物, 文物级别]
          confidence: official_museum_webpage
          sources: [source-china-silk-figured-damask-robe-1819]
        - id: fact-silk-figured-damask-robe-material
          type: material
          statement: 这件绫袍的馆方登记质地为丝，色泽为黄色。
          keywords: [材质, 质地, 丝, 黄色]
          confidence: official_museum_webpage
          sources: [source-china-silk-figured-damask-robe-1819]
        - id: fact-silk-figured-damask-robe-dimensions
          type: dimensions
          statement: 绫袍长124厘米，胸围54厘米，通袖长182厘米。
          keywords: [尺寸, 长, 胸围, 通袖长, 厘米]
          confidence: official_museum_webpage
          sources: [source-china-silk-figured-damask-robe-1819]
        - id: fact-silk-figured-damask-robe-appearance
          type: appearance
          statement: 绫袍为左衽、交领、窄袖，以套环人物纹绫为主要面料，套环中填有几何化人物纹样。
          keywords: [外形, 左衽, 交领, 窄袖, 套环人物纹, 几何人物纹]
          confidence: official_museum_webpage
          sources: [source-china-silk-figured-damask-robe-1819]
        - id: fact-silk-figured-damask-robe-history
          type: history
          statement: 这件环人物纹绫袍由中国丝绸博物馆从青海民间征集。
          keywords: [来源, 征集, 青海, 民间]
          confidence: official_museum_webpage
          sources: [source-china-silk-figured-damask-robe-1819]

