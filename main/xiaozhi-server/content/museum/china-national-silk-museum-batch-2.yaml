        - id: fact-silk-gold-damask-robe-usage
          type: usage
          statement: 馆方说明，这类织金绫大袖袍是蒙元时期女性的正式礼服。
          keywords: [用途, 女性, 正式礼服, 蒙元]
          confidence: official_museum_webpage
          sources: [source-china-silk-gold-damask-wide-sleeve-robe-1853]
        - id: fact-silk-gold-damask-robe-craft
          type: craft
          statement: 袍服领袖使用两种纳石失织金锦，主体原有织金图案，但金箔现已脱落。
          keywords: [工艺, 纳石失, 织金锦, 织金, 金箔, 脱落]
          confidence: official_museum_webpage
          sources: [source-china-silk-gold-damask-wide-sleeve-robe-1853]

