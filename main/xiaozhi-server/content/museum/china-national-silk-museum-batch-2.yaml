    status: active
    revision:
      id: yuan-gold-damask-wide-sleeve-robe-r1
      number: 1
      status: draft
      facts:
        - id: fact-silk-gold-damask-robe-era
          type: era
          statement: 馆方将这件织金绫大袖袍定为元代藏品，文物级别为一级。
          keywords: [年代, 元代, 一级文物, 文物级别]
          confidence: official_museum_webpage
          sources: [source-china-silk-gold-damask-wide-sleeve-robe-1853]
        - id: fact-silk-gold-damask-robe-material
          type: material
          statement: 这件大袖袍的馆方登记质地为丝，色泽为黄色。
          keywords: [材质, 质地, 丝, 黄色]
          confidence: official_museum_webpage
          sources: [source-china-silk-gold-damask-wide-sleeve-robe-1853]
        - id: fact-silk-gold-damask-robe-dimensions
          type: dimensions
          statement: 这件大袖袍长145厘米、宽200厘米。
          keywords: [尺寸, 长, 宽, 厘米]
          confidence: official_museum_webpage
          sources: [source-china-silk-gold-damask-wide-sleeve-robe-1853]
        - id: fact-silk-gold-damask-robe-appearance
          type: appearance
          statement: 大袖袍为右衽交领、大袖收口，主体有小朵云纹，仍可辨认心形窠中的飞鸟纹样。
          keywords: [外形, 右衽, 交领, 大袖, 云纹, 心形窠, 飞鸟纹]
