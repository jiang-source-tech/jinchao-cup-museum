server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: ""
  vision_explain: ""
  timezone_offset: 8
  auth:
    enabled: false
    allowed_devices: []
  # 启用认证时，必须在未跟踪的 data/.config.yaml 中配置 auth_key。

log:
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{extra[selected_module]}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{extra[selected_module]} - {name} - {level} - {extra[tag]} - {message}"
  log_level: INFO
  log_dir: tmp
  log_file: server.log
  data_dir: data

delete_audio: true
close_connection_no_voice_time: 120
tts_timeout: 10
tool_call_timeout: 30
enable_wakeup_words_response_cache: false
enable_greeting: false
enable_stop_tts_notify: false
enable_websocket_ping: false
wakeup_response_start_delay_ms: 300
tts_ready_ack_timeout_ms: 700
tts_ready_start_retry_delays_ms: [300, 600, 1200]
tts_delivery_retry_delays_ms: [2000, 5000, 15000, 30000]
tts_done_ack_timeout_ms: 10000

exit_commands: ["退出", "关闭"]
wakeup_words: ["你好讲解员"]
plugins: {}
prompt: "你是金潮杯博物馆现场语音讲解助手。只根据当前展品的已发布演示资料回答；资料不足时明确说明，不补充猜测。"
prompt_template: agent-base-prompt.txt
system_error_response: "刚才的讲解链路出了点问题，请再问一次。"
end_prompt:
  enable: false
  prompt: ""

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# 干净检出只启动传输与 HTTP 服务，不选择任何需要凭据的模型。
selected_module: {}
VAD: {}
ASR: {}
LLM: {}
VLLM: {}
TTS: {}

business_runtime:
  type: museum
  database_path: data/museum_demo.db
  # 仅供本地演示。生产环境必须保持 false，正式内容通过内容包发布。
  seed_demo_content: false
  exhibit_context_mode: explicit
  auto_assign_unknown_devices: false
  session_idle_ttl_minutes: 5
  session_max_ttl_minutes: 30
  retrieval:
    # legacy_facts 保持现有事实链路；evidence_segments 启用原文片段 RAG。
    backend: legacy_facts
    # 仅对 legacy_facts 生效：rules 保持原检索；shadow 只记录向量对照；hybrid 启用融合结果。
    mode: rules
    embedding_model: text-embedding-v4
    embedding_dimension: 1024
    embedding_timeout_seconds: 3
    qdrant_url: ${MUSEUM_QDRANT_URL:-http://qdrant:6333}
    qdrant_collection: museum_facts_v1
    evidence_qdrant_collection: museum_evidence_v1
    qdrant_timeout_seconds: 2
    lexical_limit: 12
    dense_limit: 12
    dense_score_threshold: 0.5
    rrf_k: 60
    circuit_failure_threshold: 3
    circuit_cooldown_seconds: 30

ota_release:
  public_ota_url: ""
  db: data/museum_firmware_releases.db
  artifact_dir: data/museum_firmware
  default_channel: stable
  allow_insecure_http: false
